","industry":"Industrial machinery","products":"AutoCAD Plant 3D; Docs; Fusion Manage","duration":"","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Andreas Nicolescu","abstract":"By 2027, every manufacturer selling into the European market will be required to provide a Digital Product Passport (DPP)—and most are not ready. This session will show how Autodesk Fusion Manage software can close that gap, while also solving a longer-standing problem: disconnected data between process plant design and PLM. You'll see how equipment data from AutoCAD Plant 3D projects on Autodesk Forma (formerly Autodesk Construction Cloud) can automatically populate Fusion Manage BOMs—eliminating manual handoffs between plant design and PLM. And you’ll see how that same structure can generate EU-compliant DPPs on demand, without duplicate data entry—connecting project context from Autodesk Forma with product lifecycle data where it belongs. Both extensions are built on Autodesk Platform Services APIs and demonstrated live.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105121913001PLAx"},{"code":"UTL3867-D","title":"From Plan to Pour: Aurigo Primus Plan and Autodesk Forma for Asset Owners","type":"Technical Deep Dive","track":"Construction Management","industry":"Utilities and telecom","products":"","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Johann Potgieter","abstract":"Bridge the gap between capital planning and project execution. Led by Aurigo's director of product, this technical deep dive will explore Primus Plan and its powerful integration with Autodesk Forma (formerly Autodesk Construction Cloud). We’ll showcase our AI-powered what-if scenario planning, demonstrating how to optimize multi-year capital portfolios before pushing them to downstream construction management. Walk through the technical architecture and data flows that move infrastructure projects from early-stage planning straight into execution within Autodesk Forma. Learn how to eliminate data silos, maximize funding, and maintain total visibility across the entire project lifecycle.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105140137001PrlV"},{"code":"CP3562-D","title":"From Prompt to Production: Designing Furniture at the Speed of AI with Fusion","type":"Technical Deep Dive","track":"Product Development","industry":"Consumer products","products":"Fusion; Fusion Manage; Fusion Nesting and Fabrication Extension; Fusion Operations","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist; Small Business","speakers":"Melike Ozdemir","abstract":"Designing and manufacturing furniture often relies on disconnected tools and repetitive work. This session will explain how to create a connected, end-to-end workflow using the Autodesk Fusion platform. Starting from simple prompts, Autodesk Assistant accelerates design and enables fast creation of parametric furniture models. This workflow will show how models are refined for engineering, prepared for manufacturing with integrated CAM tools, and transferred to production using Autodesk Fusion Operations software—while Autodesk Fusion Manage ensures process and data continuity from request to delivery. It will also highlight how design intent is preserved and how a single data environment reduces errors.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105134044001PaID"},{"code":"BLD2652-D","title":"From Reality to Simulation: Capturing, Predicting & Replaying the Experience of Design with APS & AI","type":"Technical Deep Dive","track":"Software Development","industry":"Buildings","products":"Autodesk Platform Services","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Kean Walmsley","abstract":"How do you capture or predict the human experience of design and replay it to build empathy and drive better design decisions? This session will present a technical workflow spanning three research projects: real-world experience capture (The Bentway, Toronto), XR-based capture in virtual environments, and agentic simulation of human behavior. Learn how Autodesk Platform Services powers a system where human-experience data—whether captured using sensors, or in VR, or predicted using AI—can be replayed by designers to better appreciate the diversity of the human experience of design. We’ll explore the technology that will power future human-experience-driven workflows, from sensors and VR headsets to knowledge graphs and vision language models.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105118630001PkZU"},{"code":"AS4166-D","title":"From Revit Stills to Stories: AI Video Workflows for Architectural Communication","type":"Technical Deep Dive","track":"Architecture","industry":"Architecture services","products":"3ds Max 2; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Qian Huang","abstract":"Architects increasingly need to communicate design intent through motion before there is time or budget for traditional animation and for audiences who do not read drawings. This session shows how approved design assets from Revit based rendering views, diagrams, sketches, physical model, photos, can become short AI-assisted motion assets for design reviews, competitions, and client presentations. Attendees will learn a repeatable still-to-video workflow, see where AI video supports architectural communication and where it falls short, and apply QA guardrails for review and trust before using outputs in practice. A 5 minute case study assembled from 30 AI-assisted clips will also demonstrate how short generations become a coherent story.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105145240001P8zi"},{"code":"CS3884-D","title":"How Cleveland Construction Added AI-Powered Submittal and Drawing Reviews to Autodesk Forma","type":"Strategy Talk","track":"Construction Management","industry":"Construction services","products":"None","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Executive & Decision Maker","speakers":"Elliot Christiansen","abstract":"When Cleveland Construction migrated from Procore to Autodesk, company leaders saw an opportunity to build an intelligent document pipeline and agentic workflows on top of the wealth of data they run their business on in Autodesk. In this session, Elliot Christiansen, SVP of operations at Cleveland Construction, will share how his team configured their Autodesk environment to enable AI-powered workflows that automatically review submittals against specs and new bulletins against previous ones. Brandon Ramsey, VP of customer success from Trunk Tools, an App Marketplace Partner, will join Elliot to share Cleveland's winning playbook to transition from handshakes to driving deep adoption across their project teams.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105140804001P9Lm"},{"code":"CES2852-D","title":"IFC 4.3 for Infrastructure: From Export to Digital Delivery","type":"Technical Deep Dive","track":"Civil Engineering","industry":"Civil infrastructure","products":"Forma Design Collaboration; BIM Collaborate Pro; Civil 3D; Cloud Worksharing; Docs","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Salwan Abbosh; Morgan Smith","abstract":"IFC 4.3 enables open data exchange for infrastructure, yet many teams struggle to turn IFC exports into information that projects can rely on. This session will move beyond export steps and focus on using IFC effectively on infrastructure projects. You’ll learn how IFC 4.3 works once it leaves Civil 3D software, including how models are governed, versioned, reviewed, and trusted. Topics will include model view definitions, the IFC Reference View for civil infrastructure, and common mistakes that reduce value. The session will also introduce Autodesk Forma Data Management as a practical way to manage IFC delivery at scale, supporting controlled sharing and review. You’ll leave with guidance on positioning IFC as a trusted project resource.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105124097001PfYx"},{"code":"CS3468-D","title":"Industrialized Construction at Scale: Data-Driven Sustainability for Modular Systems","type":"Strategy Talk","track":"Impact & Sustainability","industry":"Construction services","products":"Revit","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Executive & Decision Maker","speakers":"Mergim Hoti","abstract":"How can industrialized construction, intelligent data, and integrated workflows turn sustainability from a reporting burden into a scalable design strategy? In this session for architecture, engineering, and construction (AEC) leaders and delivery teams, Max Bögl Group will share how one company manages the value chain—from raw material sourcing and design to off-site production, delivery, assembly, and maintenance—to deliver modular buildings and bridge systems with measurable sustainability outcomes. As we use projects from Germany and the Netherlands, you’ll see how standardized, parametric products, connected models, and automated assessments help teams compare options faster, respond to strict European requirements, and build the data foundation for future AI-supported design decisions.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105133497001PssM"},{"code":"BLD3267-D","title":"Integrated Real-Time MIDP using Autodesk Forma Reviews and Autodesk Platform Services","type":"Technical Deep Dive","track":"Autodesk Platform Services (APS)","industry":"Buildings","products":"Autodesk Platform Services; Forma","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Mateusz Lukasiewicz","abstract":"Keeping a Master Information Delivery Plan (MIDP) accurate on live projects is one of the biggest challenges for BIM managers and project managers. Issuing incomplete or unreviewed deliverables puts contracts at risk. In this class, we’ll show how Autodesk Platform Services Webhooks and the Reviews tool in Autodesk Forma transform the MIDP into a live system that validates deliverable metadata against information requirements and confirms review status before submission. Using real project examples and proven metrics, we’ll show how this ensures 100% compliance with contractual deliverables, eliminates manual tracking, and mitigates the risk of noncompliant submissions. Join us to learn how to build a QA/QC system that keeps your MIDP accurate, connected, and audit ready.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105130201001PVs0"},{"code":"CES1612-D","title":"Integrating Nature-Based Solutions in Civil 3D and","type":"Technical Deep Dive","track":"Impact & Sustainability","industry":"Civil infrastructure","products":"Civil 3D; InfraWorks","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Growing Team Leader","speakers":"Carlos Rogeliz","abstract":"Nature-based solutions (NbS) are reshaping how civil teams deliver resilient water infrastructure. Yet integrating watershed-scale insights into detailed design remains a challenge. This session will show how The Nature Conservancy applied targeted training and InfraWorks and Civil 3D software to connect regional watershed analysis with site-level engineering workflows. Learn how to translate watershed data into design inputs, develop NbS concepts into constructible models, and maintain data continuity across planning and design phases. See how connected workflows improved cross-team collaboration, enabled earlier decision making, and reduced project risk in real-world water infrastructure projects.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105095176001PAbw"},{"code":"AU4189-D","title":"Maximizing Autodesk Platform Services Value: Smarter Usage, Greater Control, AI-Ready Scale","type":"Strategy Talk","track":"Autodesk Platform Services (APS)","industry":"Other","products":"","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Dwanill Mehta","abstract":"Autodesk Platform Services continues to evolve to better support how customers build, scale, and optimize applications in an increasingly AI-driven world. APIs and Model Context Protocols (MCPs) are becoming foundational to agentic AI workflows, making it more important than ever to understand and optimize Autodesk Platform Services use. This session will highlight the features Autodesk Platform Services is building to help you make the most of cloud APIs and MCPs, whether developing directly on Autodesk Platform Services or integrating through third-party applications. You’ll also see new capabilities that provide greater visibility and control, including Autodesk Platform Services reporting, cost management tools, and AI-powered usage prediction through Autodesk Assistant. Join us to learn how to scale with confidence and maximize value from Autodesk Platform Services.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105147454001Pmgq"},{"code":"AS2698-D","title":"MCP on Autodesk Platform: Three Production Servers Across the Full Stack","type":"Technical Deep Dive","track":"Software Development","industry":"Architecture services","products":"Autodesk Platform Services; Dynamo; Revit","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Jose Baquero; Enrique Galicia Tovar","abstract":"Model Context Protocol (MCP) is the layer that lets AI agents access Autodesk tools, data, and APIs through a standardized interface. The firms building this infrastructure today will define the standard—not just use it. This session will go deep on three production MCP servers: revitDeploymentMCP (CI/CD pipeline as four AI-callable tools), a Dynamo MCP server (exposing Dynamo scripts for AI orchestration), and an Autodesk Platform Services Data Pipeline server (chaining the Model Derivative API, the Data Management API, and the Design Automation API without auth failures or silent webhook drops). Each server is examined at the architecture, implementation, and deployment levels. You’ll receive complete implementation patterns for all three.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105119743001P1b4"},{"code":"AU4170-D","title":"Measuring Perceptions of Trust: How to Turn Trust into Tangible Results","type":"Technical Deep Dive","track":"Inclusive Innovation, Culture, & Belonging","industry":"Other","products":"None","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Kate Adam","abstract":"In this interactive session, you’ll learn how to apply to your organization some frameworks for measuring and building trust. You’ll learn strategies for assessing trust across customer and employee experiences, and you’ll learn how to identify gaps and prioritize high-impact opportunities. Through guided exercises and real-world scenarios, you’ll map trust drivers—capability, reliability, transparency, and humanity—to key workflows, products, and culture. The session will conclude with a practical action plan to build trust, improve outcomes, and drive measurable business results.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105145784001P3hf"},{"code":"AS1569-D","title":"Multi-AI-Agent BIM Orchestration: Building Autonomous Query. Check. Fix Loops for Revit.","type":"Technical Deep Dive","track":"Autodesk Platform Services (APS)","industry":"Architecture services","products":"Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Phuc Le","abstract":"\u003cp>What if your Revit model could check itself—and fix what it finds—autonomously? This session will introduce a multi-agent system where specialized AI agents collaborate in a loop: a Query agent will read model data via Model Context Protocol (MCP), a QC agent will check it against configurable standards, and a Design agent will propose corrections - each previewed, human-approved, and audited before any write. The cycle will repeat until the model passes. We’ll demo three live scenarios: Naming Convention Fix, Parameter Completeness, and Geometry Checking - built with Revit MCP Server, Forma MCP, Python, LangGraph, and configurable YAML rules. We'll also cover transaction management, convergence control, and the points where human oversight remains essential.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105094052001PAES"},{"code":"BLD3677-D","title":"No More “BIM Guy”: Driving Real Digital Transformation Across Construction","type":"Strategy Talk - Panel","track":"Preconstruction","industry":"Buildings","products":"None","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Executive & Decision Maker; Growing Team Leader; Small Business","speakers":"Morgan Drivas; Danielle Dy Buncio; Brett Settles; Ravi Wood; Prateek Shailesh Chitnis","abstract":"\"That's the BIM guy's job.\" Whether you've heard it on a job site, in a coordination meeting, or in a boardroom, you know the gap this panel is here to close. An owner, a heavy industrial GC, a self-perform contractor, and a specialty MEP contractor join moderator Prateek Chitnis for an unfiltered conversation about what digital transformation actually costs across the construction ecosystem. No polished success stories. No vendor pitches. Just four practitioners from different seats at the table, each with a different definition of what \"BIM adoption\" means, and each with failures they haven't talked about publicly. Yet.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105136802001PLtx"},{"code":"FAB1950-D","title":"Orchestrating Industrialized Construction with AI Agents: Connecting Product and Project Workflows","type":"Technical Deep Dive","track":"Industrialized Construction","industry":"Building products and fabrication","products":"Forma; Fusion; Fusion Manage; Inventor; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Andy Akenson","abstract":"Industrialized construction requires coordination across design and manufacturing workflows, but today these processes remain fragmented. This session will explore how AI agents can help connect product and project workflows, enabling earlier decision making and improved constructability. You’ll see how validation and specification workflows can be applied today within Autodesk tools, along with a phased view toward configuration, productization, and continuous improvement. A real workflow example will demonstrate how teams can move from disconnected automation to coordinated execution.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105104115001PVCI"},{"code":"BLD4086-D","title":"Powering Paperless Contractor Submissions and Tracking Across 50 Million Square Feet with Autodesk Forma and Data Analytics","type":"Technical Deep Dive","track":"Construction Management","industry":"Buildings","products":"BIM 360 Build; Build; Forma","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Growing Team Leader","speakers":"Japneesh Singh; Ritesh Mittal","abstract":"Disconnected contractor submissions and manual tracking reduce visibility, slow approvals, and limit scalability. In this session, you’ll learn how a paperless submission framework was deployed across a 50-million-square-foot portfolio using Autodesk Forma. Integrated workflows were established using Submittals, RFIs, and Forms to standardize contractor interactions, enable consistent data capture, and ensure full traceability. Through APIs, disparate data sources were unified and transformed into intelligent data models that power advanced dashboards. Discover how this approach delivers real-time submission tracking, improved transparency, and faster data-driven decisions—providing a scalable blueprint for digital transformation at an enterprise level.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105143024001PFQO"},{"code":"CES1779-D","title":"Predict Before You Model: How We Built an ML-Powered MEP Estimating Bot Trained on 300+Real Projects","type":"Strategy Talk","track":"MEP Engineering & Fabrication","industry":"Civil infrastructure","products":"BIM 360 Docs; Revit","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Executive & Decision Maker","speakers":"Gustavo Gusmão; Gabriel Campos","abstract":"What if you could generate a reliable MEP cost estimate before modeling a single element in Revit software? That’s exactly what we built: a Python-based estimation bot trained on more than 300 real MEP projects from our historical data. Instead of relying on disconnected spreadsheets or manual takeoffs, the bot uses pattern recognition to generate estimates at the proposal stage before BIM begins. Our solution achieves more than 95% accuracy versus final costs, and it reduces estimation time by more than 70%. In this session, we’ll show how we structured the data, trained the model, and integrated it into our workflow. You’ll leave this session with a practical framework to turn historical data into a predictive asset.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105100793001PAPK"},{"code":"CS2111-D","title":"Preparing Construction Data for AI","type":"Strategy Talk","track":"Construction Management","industry":"Construction services","products":"Build; Docs; Forma","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Growing Team Leader","speakers":"Matthew Fern","abstract":"Everyone wants AI in construction. Almost no one has data ready for it. Poor structure, inconsistent metadata, and fragmented workflows hold most teams back. This session will share real-world lessons from Stowe Australia, implementing Autodesk Forma as a common data environment (CDE) to fix that problem. Learn how ISO 19650 principles, standardized templates, and disciplined workflows turn messy project information into structured, usable data. The result? A scalable foundation for analytics, automation, and AI across projects, teams, and the wider business.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105106874001PiqN"},{"code":"BLD3379-D","title":"Preparing LAX for the 2028 Olympics: AI-Powered Digital Twins with Autodesk Tandem MCP","type":"Technical Deep Dive","track":"Capital Project Owners & Operators","industry":"Buildings","products":"Autodesk Platform Services; Autodesk Viewer; Forma; Tandem Connect","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Educator & Workforce Builder","speakers":"James Awe; Michael Beale; Mingxun Zou","abstract":"\u003cp>With the 2028 Los Angeles Olympics approaching, Los Angeles International Airport (LAX) is modernizing to handle millions of visitors. Managing billions in capital assets across disconnected BIM, CMMS, and GIS systems is no longer viable. In this session, Mingxun Zou, James Awe and Michael Beale will reveal how Los Angeles World Airports (LAWA) built an AI-powered digital twin platform. We'll demonstrate the following: An Autodesk Tandem MCP server enabling natural language queries, a Python/Grasshopper automation extracting asset attributes to GeoJSON, and a real-time MapLibre visualization. Building on an Esri Dev Summit 2026 presentation, we'll show the evolution from manual CAD exports to AI-driven facility intelligence. Through live coding, you'll build the same integrations—preparing LAX for its Olympic moment.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105131868001PeC1"},{"code":"AS3991-D","title":"Prompt to Procurement: AI Research at MIT on Closing the Render-to-Build Loop","type":"Strategy Talk","track":"Architecture","industry":"Architecture services","products":"Autodesk Rendering; Forma; Revit","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Educator & Workforce Builder","speakers":"Richa Gupta","abstract":"Architects and BIM teams are generating AI images faster than ever. But outputs rarely connect back to real materials, specifications, or fabrication. This session will draw on three MIT Architecture and Computer Science and Artificial Intelligence Laboratory (CSAIL) research projects to show exactly where the design-to-build pipeline breaks down and what fixes it. What we’ll cover includes steering AI image generation with element-level references, matching rendered materials back into BIM specifications, and connecting natural language to robotic assembly—each finding maps to a workflow that practitioners can act on. You’ll leave with research-backed behavioral changes where AI tools genuinely add value in their pipelines and where the gaps need bridging.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105141934001P9vA"},{"code":"AS2561-D","title":"Rendering Reality: The Rise of Gaussian Splats","type":"Technical Deep Dive","track":"Media & Entertainment","industry":"Architecture services","products":"3ds Max 2","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Small Business","speakers":"Logan Foster","abstract":"Join industry experts from design visualization and VFX as they explore how Gaussian Splats and solutions from Autodesk Interactive Media & Entertainment are transforming digital workflows. Learn what these techniques are, how they enable highly accurate digital twins and immersive world building, and where they fit in real-world production pipelines. Through examples and firsthand insights, speakers will share what excites them about this approach—along with the practical pros, cons, and challenges of adopting it.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105117526001PDyE"},{"code":"BES2972-D","title":"Revit MEP Fundamentals and New Tricks","type":"Technical Deep Dive","track":"MEP Engineering & Fabrication","industry":"Engineering service providers","products":"Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Small Business","speakers":"Matthew Collier; Sean Fruin","abstract":"Many teams still rely on outdated Revit MEP habits that slow coordination and create inconsistent models. This session will cover how to build a strong foundation in spaces, connectors, systems, circuits, and documentation. Then we’ll show how recent Revit improvements support better analysis, clearer panel and circuit workflows, improved analytical visibility for duct and pipe systems, and a smoother path from design to fabrication. We’ll share practical methods that help newer users build confidence and experienced users work faster, model more accurately, and reduce rework.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105125218001PpZh"},{"code":"FAB2066-D","title":"Rule-Driven Building Design: Connecting Structural Analysis, Autodesk Forma, and Informed Design","type":"Technical Deep Dive","track":"Industrialized Construction","industry":"Building products and fabrication","products":"Dynamo; Forma; Informed Design; Inventor; Revit","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Steve Dewitt","abstract":"\u003cp>Learn how to automate decision making in type 5 designs by connecting structural analysis, product data, and off-site construction workflows across the Autodesk platform. This class will demonstrate how to integrate a Structural Analysis Design Engine (SADE) with Autodesk Forma (formerly Autodesk Construction Cloud) to automate shear wall placement, then propagate those requirements through Informed Design to drive product behavior. Using the Informed Design API and parametric logic authored in Inventor software, we’ll embed structural intelligence into configurable wall panels assigned to Autodesk Forma masses—enabling consistent, data-driven outcomes from early design through fabrication.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105105788001P8Q5"},{"code":"PM1771-D","title":"Save Time and Improve Quality: Dynamic Factory Design with Factory Design Utilities, Revit, and FlexSim Integrations","type":"Strategy Talk","track":"Digital Factory","industry":"Process manufacturing","products":"AutoCAD; Factory Design Utilities; FlexSim; Inventor; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Justin Freeman; Tyler Morrison","abstract":"Discover how combining Factory Design Utilities, Revit, and FlexSim software transforms facility design through seamless integration of 2D layouts, 3D models, and process simulation. This case study will demonstrate significant time savings by eliminating redundant updates across platforms and enabling engineering teams to make objective, data-driven decisions with less rework. This class will present the end-to-end Factory Design Utilities workflow, showing how AutoCAD, Inventor, Revit, and FlexSim software work together to enable rapid, realistic simulations and models. Engineers from Jacobs will share real project examples demonstrating ROI, cost savings, and how simulations validate designs, communicate decisions, and extend value into production planning and continuous improvement.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105100240001P7wY"},{"code":"CES2741-D","title":"Scaling Rail Data at MRS Logística: From Fragmented Workflows to Real-Time Intelligence","type":"Technical Deep Dive","track":"Civil Engineering","industry":"Civil infrastructure","products":"Build; Docs; Forma; Insight","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Growing Team Leader","speakers":"Rafael Braida","abstract":"In a reality of more than 200 railway infrastructure projects running simultaneously, data fragmentation is not a risk—it’s inevitable. This technical deep dive will show you how MRS Logística tackles this challenge by refining BIM requirements and building a standardized common data environment (CDE) in Autodesk Forma. From issues and daily reports to audits, model coordination, cost, and schedule, workflows are structured and connected at scale. Discover how Autodesk Assistant enables structured analysis and how the Insight Builder tool turns connected data into real-time intelligence—driving consistency, reliability, and faster decision making across projects.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105121360001P8Ts"},{"code":"AS1166-D","title":"Stop Sharing Screens – Start Sharing Space: Practical XR for Model Coordination","type":"Technical Deep Dive","track":"XR","industry":"Buildings","products":"Forma Data Management Essentials; Navisworks Manage; Pype; Revit Cloud Worksharing","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Joseph Huang; Raghavendra Bhat","abstract":"\u003cp>Immersive technologies are often promoted as the future of model coordination, yet most teams remain stuck in screen sharing and pilot demos. This session challenges that pattern, presenting a practical playbook for using shared immersive space as a deliberate coordination tool rather than a novelty. Through real project scenarios, it shows when XR enables faster understanding and better decisions, when desktop review works better, and how to structure immersive meetings so technical and non-technical stakeholders collaborate effectively. Hardware, visualization, and platforms matter – but only when paired with clear intent, facilitation, and decision focused workflows.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105088859001PK7W"},{"code":"CS4114-D","title":"The Good, the Bad, and the Wildcard: Big Lessons from Autodesk Forma Cost Management Implementation","type":"Strategy Talk - Panel","track":"Construction Management","industry":"Construction services","products":"Build; Docs","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Executive & Decision Maker; Growing Team Leader; Small Business","speakers":"Tim Kelleher; Brad Buckles; Richard Antczak; Ariel Castillo","abstract":"Cost management implementations don’t fail on software—they fail on assumptions. This session will break down the good, the bad, and the wildcard moments from real-world deployments, highlighting what actually drives success (and what quietly derails it). From aligning workflows between field, PMs, and accounting to managing data structure, contracts, and change processes, we’ll share practical lessons learned from implementing cost management in live projects. You’ll walk away with clear strategies to improve adoption, avoid common pitfalls, and confidently lead your own implementation.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105144139001Pp6v"},{"code":"AS2196-D","title":"The Superb Guide to Easy Revit Rides On!","type":"Technical Deep Dive","track":"Community & Expert Elites","industry":"Architecture services","products":"AutoCAD; Civil 3D; Docs; Inventor","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Small Business","speakers":"Rina Sahay","abstract":"The award-winning Superb Team continues with enhanced insights into the ever-expanding world of Revit software and its friends. Our lively conversation spiced with weird, wild, witty, and wonderful war stories will energize you with the latest and greatest developments in Revit 2027 and Autodesk Forma industry cloud. Discover wild and wonderful things to do with Revit using native tools or third-party software for reality capture, visualization, and AR/XR. Use interoperability with add-ins and other authoring and visualization software. Get a glimpse of the future with innovative use cases using AI. Discover more ways and means to enhance productivity. Join us for wise and fun pointers on how to be a fearlessly productive Revit Warrior.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105109670001P04Y"},{"code":"MFG1053-D","title":"The Truth Is Out There, But So Is the Nonsense: AI Tips & Tricks for iLogic and the Inventor API","type":"Technical Deep Dive","track":"Design & Engineering","industry":"Manufacturing Other","products":"Inventor; Inventor Professional","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Curtis Waguespack","abstract":"You've seen how iLogic can tame tedious tasks and make you more efficient. Now AI promises to go even further, writing your rules, navigating the Inventor API, and transforming your automation overnight. Sounds great, right? Here's the truth: Great results from AI are out there, but so is the AI-induced nonsense. You might have seen AI confidently generate code that doesn't work. Or watched it invent API methods that don't exist. The promise is real. But so are the hallucinations, the dead ends, and the frustrations of vibe coding. Come to this session to cut through the hype with tips, tricks, and insights for getting real results from AI, knowing when to trust it, when to push back, and how to build automation that fulfills the prompt.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105086024001PztJ"},{"code":"CES2101-D","title":"Turning BIM into AI-Powered Digital Twins: Real-Time Predictive Maintenance with IoT","type":"Technical Deep Dive","track":"Civil Engineering","industry":"Civil infrastructure","products":"Forma Design Collaboration; Autodesk Platform Services; BIM Collaborate Pro; Docs; InfraWorks; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Tolga Bozkurt","abstract":"Intelligent models are often underused after design, remaining static and disconnected from real-world operations. This session will present a real-world deployment in a metropolitan rail system, where BIM is transformed into a live, AI-powered predictive maintenance platform. Using IFC-based workflows derived from Revit software, models are converted into lightweight, web-ready formats and integrated with Internet of Things (IoT) sensor data at the asset level. An AI layer enables anomaly detection and failure prediction, reducing unplanned downtime and improving maintenance efficiency. You will gain a practical understanding of how to extend BIM into an operational digital twin and implement scalable, data-driven maintenance strategies.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105106330001P9Wl"},{"code":"BLD1110-D","title":"Unified Production Environment: How AI and Data Transformed Ramboll’s Engineering","type":"Strategy Talk","track":"Impact & Sustainability","industry":"Buildings","products":"Civil 3D; Forma; Model Coordination; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Growing Team Leader","speakers":"Marc Sleegers; David Thomson","abstract":"Ramboll is reinventing itself as a data-centered, AI‑powered engineering firm. Through its Together for Better Outcomes (T4BO) partnership with Autodesk, Ramboll has productized a unified production environment (UPE) to accelerate AI adoption. By embedding the Autodesk AI tool Autodesk Assistant into daily workflows, productivity increases while more-sustainable client value is delivered. This session will show how data-centered design and AI‑assisted engineering are transforming project delivery and ways of working, reinforcing Ramboll’s role as a partner for sustainable change. We’ll share tangible outcomes, such as higher delivery quality, deeper sustainability insights, and increased project capacity without adding headcount.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105087750001PC1d"},{"code":"IM2681-D","title":"Unlocking Autodesk Assistant: Secrets of World-Class Data Management with Vault, Common Data, & PLM","type":"Technical Deep Dive","track":"Product Development","industry":"Industrial machinery","products":"Docs; Fusion Manage; Vault PLM; Vault Professional","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Educator & Workforce Builder","speakers":"Allen Gager; Tyson Copa","abstract":"World-class implementations don’t happen by accident—they’re built on deep knowledge of how to make Autodesk tools work together intelligently. In this no-fluff session, Allen Gager will reveal the secrets every expert knows for maximizing Autodesk Assistant across the Autodesk platform while building a robust common data environment (CDE) powered by Vault and Vault PLM software. Discover how to use Autodesk Assistant (now integrated in Vault 2027, Autodesk Fusion, AutoCAD, Autodesk Forma, and beyond) as your always-on, context-aware AI partner. Learn natural language techniques to find files faster, automate routine tasks, get in-context guidance, query project data, and even drive simple automations—without ever leaving your workflow.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105119179001Pj7b"},{"code":"IM1125-D","title":"Unlocking Connected Workflows: Vault Connector for Forma and Fusion Manage","type":"Technical Deep Dive","track":"Design & Engineering","industry":"Industrial machinery","products":"Forma; Fusion Manage; Vault PLM; Vault Professional","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Younes Yammouri; Senthil Kumar","abstract":"This session will explore how the Vault Connector enables connected workflows between Vault, Autodesk Forma, and Autodesk Fusion Manage, helping organizations bridge the gap between engineering data and enterprise lifecycle processes. We’ll begin with an overview of the latest enhancements to the Vault Connector for Fusion Manage, highlighting improvements introduced in recent Vault releases. We’ll then move into a deep dive on the new Vault Connector for Autodesk Forma, exploring how it enables seamless data exchange between design environments and cloud platforms. You will gain insights into integration workflows and real-world use cases. The session will conclude with an interactive Q&A session.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105088307001PwHM"},{"code":"AS2183-D","title":"Using MCP to Build Self-Improving AEC Data Workflows","type":"Technical Deep Dive","track":"Software Development","industry":"Architecture services","products":"Autodesk Platform Services; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Nabil Sadeg","abstract":"Most architecture, engineering, and construction (AEC) data stays raw because processing it manually does not scale. This session will demonstrate a working pipeline where AI classifies documents, extracts structured information, enriches records, and validates outputs at every stage. Model Context Protocol (MCP) connects AI agents to Revit, Autodesk Platform Services, and Autodesk Forma (formerly Autodesk Construction Cloud), letting them read and write connected data across tools in a single workflow. A live walk-through of a real pipeline used on AEC projects will show how feedback loops capture user corrections so results improve with every iteration. You will leave with a reusable architecture pattern you can adapt to your own challenges, from tender analysis to intelligent models to construction submittals.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105108546001Pspe"},{"code":"MFG3731-D","title":"Vault on Autopilot: AI-Driven PDM Automation Across Lifecycle, Revisions, and ERP","type":"Technical Deep Dive","track":"Design & Engineering","industry":"Manufacturing Other","products":"AutoCAD; Inventor; Revit; Vault Professional","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Enrique Galicia Tovar; Jose Baquero","abstract":"Vault Professional software manages thousands of engineering workflows—but property assignment, lifecycle transitions, revision management, approval routing, and enterprise resource planning (ERP) synchronization remain manual. Every operation is predictable and rule-governed. This session will deliver AU 2026's Intelligent Data theme in practice: an AI agent connected to the Vault API monitoring product data management (PDM) events and executing the right action autonomously via a Model Context Protocol (MCP) agent loop. The large language model (LLM) interprets PDM state against business rules, and the API executes without manual intervention. In controlled workflows, this has reduced administrative overhead by up to 70%. You’ll leave with an ROI-prioritized implementation road map.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105137358001PEVv"},{"code":"MFG2231-D","title":"Welcome with Srinath Jonnalagadda, Vice President, Data Management, Autodesk","type":"Strategy Talk","track":"PLM","industry":"Manufacturing Other","products":"Fusion; Fusion Manage; Vault PLM; Vault Professional","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Executive & Decision Maker","speakers":"Srinath Jonnalagadda","abstract":"Kick off the PLM Summit with a high-impact keynote from Srinath Jonnalagadda, vice president of Data Management at Autodesk. He’ll dive into how organizations are tackling disconnected systems, data complexity, and relentless pressure to move faster. You’ll also gain insights into how Autodesk is addressing these challenges head-on—advancing connected data and process strategies and using the power of AI. This session will set the tone by spotlighting key themes, challenges, and opportunities you’ll explore during the PLM Summit.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105110837001PB55"},{"code":"BES2240-D","title":"Which Revit Structural Model to Use for Analysis? Analytical or Physical or Both?","type":"Technical Deep Dive","track":"Structural Engineering & Fabrication","industry":"Engineering service providers","products":"Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Marcello Sgambelluri","abstract":"This class will explore whether structural analysis workflows in Revit software should rely on the analytical model, the physical model, or a hybrid of both. Traditionally, structural analysis platforms use only the analytical model to translate geometry and structural properties from Revit. Why limit workflows to just the analytical model? With analytical and physical models now able to act independently, users can choose which representation best fits their needs. This class will compare approaches and evaluate when each method—or a combined strategy—provides the most reliable and efficient structural analysis workflow. We’ll also explore customizing structural analysis tools to accept physical model geometry.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105111949001P9BI"},{"code":"CP2994-D","title":"Your Bottlenecks Are Showing: 10 Lessons from Thousands of Product Design and Development Companies","type":"Strategy Talk","track":"Product Development","industry":"Consumer products","products":"Fusion; Fusion Design Extension; Fusion Manufacturing Extension; Fusion Simulation Extension; Inventor Professional","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Executive & Decision Maker","speakers":"Jason Lichtman","abstract":"Designing great products is difficult. Successfully taking those products to market on time and under budget is even harder. After working with thousands of product design and engineering businesses, clear patterns have emerged between teams that struggle and those that consistently deliver. In this fast-paced 30-minute session, we’ll break down 10 key lessons that separate successful teams from the rest. We’ll dive into what worked for them as well as what didn’t. You’ll leave with practical strategies to reduce delays, improve alignment, and move from concept to production with greater speed and increased confidence. If you’re a business owner or business leader who wants to fast-track your company’s success, this session is for you.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105125781001PZVl"},{"code":"WP1000-D","title":"Community watching party: Day 1 Keynote in English","type":"Watch Party","track":"","industry":"","products":"","duration":"2 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"09:00 AM","end":"11:00 AM","mode":"Live","featured":"","tabs":"Community, Live-streamed","learningPath":"Small Business","speakers":"Dzan Ta","abstract":"Hello everyone! We invite you to join us for the Day 1 Keynote, live from AU 2026 in Las Vegas. Join us in the Zoom room with several members of the Expert Elite program and Autodesk's Community Manager, Chris Benner. We'll be watching this session together and chatting live.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783466423133001tYEY"},{"code":"WP1003-D","title":"Community watching party: Day 1 Keynote en Français","type":"Watch Party","track":"","industry":"","products":"","duration":"2 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"09:00 AM","end":"11:00 AM","mode":"Live","featured":"","tabs":"Community, Live-streamed","learningPath":"Small Business","speakers":"Patrick EMIN; Jacques Rigal","abstract":"Bonjour à toutes et à tous, La Communauté Autodesk en français vous invite à participer à la session générale de l’Autodesk University, diffusée avec des sous-titres en français. Aux côtés de plusieurs membres du programme Expert Elite et de Manon Puel, Community Manager Autodesk France, rejoignez-nous dans une salle Zoom dédiée pour suivre la session ensemble et échanger en direct via le chat tout au long de l’événement. Au plaisir de vous retrouver nombreux ! À bientôt","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783353511718001by5N"},{"code":"WP1004-D","title":"Community watching party: Day 1 Keynote in Ukrainian","type":"Watch Party","track":"","industry":"","products":"","duration":"2 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"09:00 AM","end":"11:00 AM","mode":"Live","featured":"","tabs":"Community, Live-streamed","learningPath":"Small Business","speakers":"Oleksandr Kanivets; Anton Vasyliev","abstract":"Привіт всім! Від імені україномовної спільноти запрошуємо вас приєднатися до перегляду \"Головної сесії Autodesk University\" разом із спільнотою та з коментарями українською мовою. Разом із кількома учасниками програми Expert Elite, Антоном Васильєвим й Олександром Канівцем, та менеджером україномовної спільноти Autodesk, Дмитром Мухіним, приєднуйтесь до Zoom-кімнати, де ми разом подивимось цю сесію та поспілкуємося в чаті наживо. До зустрічі!","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783353511890001bSOe"},{"code":"WP1002-D","title":"Community watch party: Day 1 Keynote en Español","type":"Watch Party","track":"","industry":"","products":"","duration":"2 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"09:00 AM","end":"11:00 AM","mode":"Live","featured":"","tabs":"Community, Live-streamed","learningPath":"Small Business","speakers":"María Lucrecia Real; Brenda Chiquito; Juan Francisco Angel; Arturo Polanco; Gustavo Ubriaco Contreras; Didier Raphael Ramirez Darjo; Elmer Muñoz","abstract":"\u003cp>¡Hola a todos y a todas!\u003cbr/>\u003cbr/>\u003c/p> \u003cp>Desde la Comunidad en Español, os invitamos a que te sumes a ver el Keynote de Autodesk University en Comunidad y con subtítulos en español.\u003cbr/>\u003cbr/>\u003c/p> \u003cp>Acompañados por varios miembros del programa Expert Elite, como Lucrecia Real, Gustavo Ubriaco, Didier Ramírez Carolina Ramírez, Arturo Polanco, Brenda Chiquito, Elmer Muñoz y Juan Francisco Ángel, acompañados del Community Manager de Autodesk en Español, Joaquim Moral, súmate a la sala de Zoom dónde juntos podremos ver esta sesión y conversar vía chat en directo.\u003cbr/>\u003cbr/>\u003c/p> \u003cp>¡Nos vemos!\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783353511561001b2Fr"},{"code":"KEY1001-D","title":"Day 1 Keynote","type":"Keynote","track":"","industry":"","products":"","duration":"1 hr 30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"09:00 AM","end":"10:30 AM","mode":"Live","featured":"Yes","tabs":"Featured, Live-streamed","learningPath":"Designer, Engineer & Specialist; Educator & Workforce Builder; Executive & Decision Maker; Growing Team Leader; Small Business","speakers":"Andrew Anagnost; Raji Arasu; Clara Shih","abstract":"\u003cp>What if every person, team, and project had more capacity to deliver?\u003cbr/> \u003cbr/> Join Autodesk CEO Andrew Anagnost and CTO Raji Arasu to discover how Autodesk is helping customers move faster, reduce repetitive work, improve predictability, and unlock new value across design, make, and operate.\u003cbr/> \u003cbr/> Through live demonstrations, you'll see how Autodesk AI and Industry Clouds are helping individuals work smarter, teams collaborate more effectively, and organizations turn ideas into outcomes with greater speed and confidence.\u003cbr/> \u003cbr/> The keynote will also feature fireside chat between Andrew Anagnost and Clara Shih, founder of the New Work Foundation and a pioneering technology leader. Drawing on her experience leading AI initiatives at Salesforce and Meta, Clara will share insights on how agentic AI is transforming the way organizations work and how businesses can unlock new capacity by combining human expertise with AI.\u003cbr/> \u003cbr/> Explore how Autodesk builds AI for the real world, grounded in the data, workflows, and controls you need to get more done, solve bigger challenges, and shape what comes next.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783463814426001iYsV"},{"code":"4742-D","title":"Global Autodesk Group Network (AGN) Digital Meetup","type":"Meetup","track":"","industry":"Other","products":"None","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"10:30 AM","end":"11:30 AM","mode":"On-demand","featured":"","tabs":"Community, Digital only","learningPath":"Small Business","speakers":"","abstract":"Want to learn more about our Autodesk Group Network program? Whether you're looking to start a new group or help your existing one grow and gain visibility, join our session hosted by Sam Karas, Community Program Manager.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1786064956156001EUxj"},{"code":"CES1217-D","title":"From Autodesk Forma to IFC Compliance: Automating BIM Validation in Railway Projects","type":"Technical Deep Dive - Digital","track":"Civil Engineering","industry":"Civil infrastructure","products":"AutoCAD; Civil 3D; Dynamo","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"11:30 AM","end":"12:00 PM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"Designer, Engineer & Specialist","speakers":"Thiago Dantas; Juliana Scanoni; Juliana Scanoni; Melissa Yamada","abstract":"Ensuring BIM data quality in railway infrastructure projects remains a challenge due to manual checks, inconsistent requirements, and lack of standardization. This session will present a real-world workflow using Civil 3D software for railway design, integrated with Autodesk Forma (formerly Autodesk Construction Cloud), to automate IFC model validation using IDS. Starting from structured tabular requirements, we’ll demonstrate how to generate IDS files using Python and apply automated validation workflows. We’ll also compare this approach with commercial solutions and highlight trade-offs in scalability, control, and collaboration. Attendees will learn how to reduce manual effort, improve data consistency, and implement a scalable openBIM validation process for infrastructure projects.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1773752414251001vaMm"},{"code":"CS1882-D","title":"From Prompts to Project Outcomes: Using Autodesk Assistant in Autodesk Forma","type":"Technical Deep Dive","track":"Construction Management","industry":"Construction services","products":"","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"11:30 AM","end":"12:00 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"","speakers":"Kristina Youngblut; Shir Rustici","abstract":"AI is now embedded directly into Autodesk Forma (formerly Autodesk Construction Cloud) through Autodesk Assistant. But its real value comes from how it improves decisions, not just how it responds to prompts. This session will show how to use Autodesk Assistant in real workflows, grounded in the shared data and industry context that power Autodesk Forma. Through practical examples, we’ll explore how teams can use AI to support design exploration, generate project insights, and streamline everyday tasks without leaving their workflows. You’ll learn how to structure effective prompts, refine responses, and build on outputs to turn AI-generated information into actionable decisions. We’ll also cover where Autodesk Assistant delivers the most value today and where its limitations lie.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610787819001b4nA"},{"code":"4521-D","title":"Innovators Stage | What Pacesetters know that others don’t: Insights from the 2027 State of Design & Make","type":"Strategy Talk - Panel","track":"","industry":"","products":"","duration":"45 min","day":"Tuesday (15th)","date":"2026-09-15","start":"11:30 AM","end":"12:15 PM","mode":"Live","featured":"Yes","tabs":"Featured, Live-streamed","learningPath":"","speakers":"Vikram Dutt","abstract":"\u003cp>Join Autodesk’s Vikram Dutt and a lively panel of customers as they unpack the most surprising findings from our fourth annual State of Design & Make report. We’ll challenge assumptions, debate what the data really means, and explore the trends shaping the future of AEC, design & manufacturing, and media & entertainment industries. See how the landscape is evolving, discover who’s pulling ahead, and find out whether your organization is keeping pace—or setting it.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783613621816001h6JX"},{"code":"AU1394-D","title":"Production-Ready Auth for MCP Servers: A Practical Deep Dive for Autodesk Platform Services Developers","type":"Technical Deep Dive","track":"Autodesk Platform Services (APS)","industry":"Other","products":"","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"11:30 AM","end":"12:00 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Designer, Engineer & Specialist","speakers":"Petr Broz; Akash Srivastava","abstract":"Designing secure Model Context Protocol (MCP) servers that integrate with Autodesk Platform Services requires choosing and implementing the right authentication strategy for each use case. This session will provide a technical deep dive into recommended MCP auth patterns, including 2-legged versus 3-legged flows, user-delegated access, and service-to-service scenarios. We’ll examine trade-offs, token handling, and common pitfalls. We’ll then walk through practical implementation patterns based on real examples from the Autodesk Platform Services MCP server reference. You’ll leave with actionable guidance for building secure, production-ready integrations.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610786206001bN9t"},{"code":"BES1515-D","title":"The AutoCAD Plant 3D 2027 Treasure Chest: Unlocking Collaborative Efficiency in Process Plant Design","type":"Technical Deep Dive - Digital","track":"AutoCAD & General Design","industry":"Engineering service providers","products":"AutoCAD P&ID; AutoCAD Plant 3D","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"11:30 AM","end":"12:30 PM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"","speakers":"Bernd Gerstenberger","abstract":"Discover the revolutionary innovations in AutoCAD Plant 3D 2027 software that will transform the way you work in process plant design. Experience the new isometric sheet collection, where you’ll get an entire line number in a single isometric drawing. Streamline your work with improved AutoCAD P&ID Modeler, including the completion rate and status. Take advantage of P&ID enhancements such as the ability to substitute several components in one single step using the Property Palette. And learn more about several additional new features in AutoCAD Plant 3D 2027. This session will give you practical insights into how you can use these innovations to make your daily tasks more efficient and successfully complete your projects.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1774522344009001EyD5"},{"code":"AS2515-D","title":"Ask the Experts Panel: AI in AutoCAD and Civil 3D, From Today's Tools to Tomorrow's Workflows","type":"Spark Session","track":"AutoCAD & General Design","industry":"Architecture services","products":"AutoCAD; AutoCAD LT; Civil 3D","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"01:30 PM","end":"02:30 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Designer, Engineer & Specialist; Small Business","speakers":"Anum Mithani; Alëna Iouguina; Peter Qian; Sachin Singh; Tim Yarris","abstract":"\u003cp>Curious how AI is actually showing up in AutoCAD, AutoCAD Web, and Civil 3D, and where it's headed next? In this interactive panel, our experts will go beyond the hype to talk about how AI is starting to change the way design work gets done. We'll explore where AI shows up in your workflows today, how Autodesk Assistant is evolving with Model Context Protocols (MCPs) to support faster, smarter decisions, and what's coming as AI becomes a more active partner in the design process across desktop and web. Expect a candid conversation about the opportunities, the open questions, and how you can start putting AI to work right now. The session is moderated with plenty of time for audience questions so come ready to ask.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1784146538543001uR0e"},{"code":"BLD3772-D","title":"From Design Intent to Preconstruction Reality: Closing the Carbon Data Handover Gap","type":"Strategy Talk - Panel","track":"Preconstruction","industry":"Buildings","products":"BIM 360 Build; Build; Quantity Takeoff; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"01:30 PM","end":"02:30 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Executive & Decision Maker","speakers":"Marta Bouchard","abstract":"Decarbonization is accelerating across the built environment, yet the architecture, engineering, and construction (AEC) industry lacks consistent ways to manage carbon data across project phases. Through a collaboration led by the World Business Council for Sustainable Development (WBCSD) and Autodesk, 11 leading AEC firms are working to define and improve how carbon data transitions from design to preconstruction. Based on applied learnings, this panel will examine data challenges in the preconstruction handoff, including gaps in material quantities, nonmodeled elements, specifications, and assumptions—and we’ll highlight emerging best practices and recommendations. Gain practical strategies for your projects and ways to improve carbon data consistency, transparency, and decision making across phases.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105139035001PGwK"},{"code":"4534-D","title":"Innovators Stage | Preserving What Matters: Digital Innovation and the Future of Historic Stewardship","type":"Strategy Talk - Panel","track":"","industry":"","products":"","duration":"45 min","day":"Tuesday (15th)","date":"2026-09-15","start":"01:30 PM","end":"02:15 PM","mode":"Live","featured":"Yes","tabs":"Featured, Live-streamed","learningPath":"","speakers":"Touf Hassoun; Elisabeth Zornes","abstract":"\u003cp>Historic landmarks carry memory, identity, and community — but preserving them is increasingly complex as age, climate, and visitor demand put new pressure on cultural sites. Justin Gunther, Vice President and Director of Fallingwater, will share what it takes to steward one of Frank Lloyd Wright’s masterpieces for future generations. Touf Hassoun, CEO of Case Technologies, will discuss how reality capture, digital twins, and AI are helping preservation teams better understand and protect historic places. Autodesk Chief Customer Officer Elisabeth Zornes will moderate a conversation on how craft, expertise, and technology can move preservation from reactive repair to proactive, data-informed stewardship with innovation at the center.\u003cbr/> \u003cbr/> \u003ca href=\"https://www.youtube.com/watch?v=0Xrw0qSU9Zo\" rel=\"noopener noreferrer\" target=\"_blank\">Short documentary\u003c/a>\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783613621953001hJka"},{"code":"CES1558-D","title":"One Digital Playbook – Scaling Lessons Across Level Crossing Removal","type":"Strategy Talk - Digital","track":"Civil Engineering","industry":"Civil infrastructure","products":"BIM 360 Build; BIM 360 Docs; Civil 3D; Navisworks Manage; Revit","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"01:30 PM","end":"02:00 PM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"Growing Team Leader","speakers":"Jack Donaghy","abstract":"This session will explore how Auckland’s road-rail level crossing program used the Autodesk platform to deliver complex infrastructure under a fast‑tracked delivery program. Using Autodesk Forma as a common data environment, the team standardized site visit reporting with Forma Build, automated asset data management through Autodesk APIs, and enhanced design quality with improved clash detection workflows. Design models were integrated with site time‑lapse imagery using Viewer APIs and augmented reality to improve construction insight. The program also used Revit software to produce high‑quality renders, video fly‑throughs, and 3D‑printed pedestrian bridge models, improving stakeholder engagement and decision making.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105093499001PpFQ"},{"code":"BLD3661-D","title":"AutoCAD Tips, Tricks, and the Most-Human Drafting Techniques","type":"Technical Deep Dive","track":"Community & Expert Elites","industry":"Buildings","products":"AutoCAD; AutoCAD Architecture; Civil 3D; Forma Data Management Essentials","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"03:00 PM","end":"04:00 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Educator & Workforce Builder; Small Business","speakers":"Donnie Gladfelter","abstract":"You keep asking your assistant to act like an Autodesk Expert Elite member specializing in AutoCAD software, but your artificially intelligent relationship with it remains … complicated. Because somewhere between the Model Context Protocol (MCP) and the suspiciously effective large language model (LLM) that completes your sentences, your drawings still need a human. In this ninth installment of AU's top-rated AutoCAD Tips session, Autodesk Expert Elite Member Donnie \"The CAD Geek\" Gladfelter will deliver the most-human drafting techniques backed by the intelligence of AutoCAD 2027, including Geometry Cleanup, Smart Blocks, and Checkout that ends read-only standoffs. Plus, you’ll get deep cuts no chatbot can replicate. That's why yours flagged this session for excessive human productivity and hoped you'd never find it.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1784235182551001o7r7"},{"code":"BLD2228-D","title":"Create Your Own AI Assistant That Interacts with Revit and Other Programs at the Same Time","type":"Technical Deep Dive","track":"Architecture","industry":"Buildings","products":"Dynamo; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"03:00 PM","end":"04:00 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"","speakers":"Marcello Sgambelluri","abstract":"Current AI assistants for Revit software typically operate within a single application. This class will explore a different approach by creating a custom AI assistant that can interact with Revit and other programs simultaneously using a Model Context Protocol (MCP) server. The assistant can be extended to interact with additional tool applications to help solve interoperability. When creating a custom AI assistant, the available actions are defined explicitly. You’ll configure which Revit functions are exposed to the assistant and which are not. For example, you can restrict commands that delete elements, remove views, or make unwanted model changes. No prior AI or server development experience is necessary.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105110259001P6AT"},{"code":"4490-D","title":"Innovators Stage | The Power of Storytelling in a Data-Driven World","type":"Strategy Talk","track":"","industry":"","products":"","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"03:00 PM","end":"04:00 PM","mode":"Live","featured":"Yes","tabs":"Featured, Live-streamed","learningPath":"","speakers":"Tom Kelley","abstract":"Whether you're proposing a new product, presenting a design, or helping clients imagine a better future, storytelling is often what moves ideas from possibility to reality. In today's data-driven world, storytelling has become an essential skill for anyone who wants to gain influence, inspire action, and help others see what's possible. In this engaging session, Tom Kelley shares memorable examples from business, design, and innovation, along with practical techniques for transforming data and insights into stories that resonate with colleagues and decision-makers. Along the way, you'll have a live \"thumbs up or thumbs down\" moment, as you help decide which topic Tom explores next. You'll leave with practical storytelling tools and a fresh perspective on how compelling stories help turn promising ideas into reality by first helping other people imagine a future that doesn't yet exist.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783613621677001hEkd"},{"code":"CS3844-D","title":"AEC Roadmap: Autodesk Forma Build","type":"Roadmap","track":"Construction Management","industry":"Construction services","products":"","duration":"1 hr 30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"04:30 PM","end":"06:00 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Executive & Decision Maker","speakers":"Tori Anderson; Courtney Wright; Adam Arcus; Manu Venugopal; Emilio Mercado; Sagi Zeberger; David Kadyshewich","abstract":"\u003cp>From punch lists to submittals and RFIs, your tools must be jobsite-ready and drive project progress. Strong field execution and project management rely on connected, efficient workflows. Join the Autodesk Forma Project Management and Field Delivery teams for a deep dive into what’s new and what’s next for project management and field across Forma Build Essentials, Forma Build, and the Forma Mobile app. See how we’re designing core field and project management tools that help teams plan, execute, and close work on-site, in the trailer, and in the office. Learn how data flows between field and project workflows to improve visibility, accountability, and decisions. And see how your feedback is shaping the roadmap, including Autodesk AI.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610788695001b3EZ"},{"code":"AS1297-D","title":"Bridging the Knowledge Gap: An Open-Source RAG Approach to Reliable Revit Development","type":"Technical Deep Dive - Digital","track":"Community & Expert Elites","industry":"Architecture services","products":"Revit; Revit LT","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"04:30 PM","end":"05:30 PM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"","speakers":"兰辉 徐","abstract":"What if anyone could automate Revit software—without writing a single line of code? This session introduces an open-source AI agent that turns natural language into executable Revit operations. Built on retrieval augmented generation (RAG) and Model Context Protocol (MCP), it retrieves knowledge from Revit API Docs, generates C# code, and executes it inside Revit in real time. Key highlights include the following: There are no hardcoded rules—the large language model (LLM) reasons from real API signatures. There are no preset commands—never-seen operations are reasoned and created on the fly. Successful operations solidify into reusable templates—non-developers replay them instantly. And there’s a live Revit connection via TCP JSON-RPC with Roslyn dynamic compilation. No C# experience or plug-in background is needed. And there’s no command library to maintain. Just describe what you want.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1774013190323001sWOP"},{"code":"AS1552-D","title":"Digital Practice Playbook: AI, Culture, and the Future of Practice","type":"Strategy Talk - Digital","track":"Architecture","industry":"Architecture services","products":"None","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"04:30 PM","end":"05:30 PM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"Executive & Decision Maker; Growing Team Leader","speakers":"Evan Troxel","abstract":"After 200+ architecture, engineering, and construction (AEC) conversations on the TRXL podcast, clear patterns have emerged about how the profession is really engaging with AI. It's not what you'd expect. This session will distill 10 months of front-line insights into five themes organized around a Digital Practice OS: why firms automate the wrong things; how curiosity becomes a KPI; why authorship still matters; the rise of tech-driven leadership; and Knowledge Management 3.0. Hear from the practitioners driving this change, confront the myths holding firms back, and leave with a 30-60-90 day plan to execute Monday morning.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1774562894938001pVlC"},{"code":"EDU3663-D","title":"From Classroom to Jobsite: Building Design-to-Make Curriculum with Autodesk","type":"Strategy Talk - Panel","track":"Impact & Sustainability","industry":"Education","products":"","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"04:30 PM","end":"05:30 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"","speakers":"Jovan Madjovski; Regan Brewer; Kate McElligott; Agata Zytniak","abstract":"\u003cp>How do you turn Design-to-Make workflows into job-ready curriculum? This panel brings together JARC, SEAF, Bechtel, and Lippert to show how Fusion, Revit, and Autodesk Forma power scalable workforce training. Through real-world examples, see how learners move from concept modeling to fabrication and site execution using the same tools and data as in industry. Panelists will share how curriculum is structured, how employer input shapes projects, and how digital workflows enable delivery. Attendees will gain practical models to align training with production workflows and improve job readiness.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610788868001b9PB"},{"code":"AS1777-D","title":"That's YOUR Opinion: Revit Workflow Point / Counter Point","type":"Spark Session","track":"Community & Expert Elites","industry":"Architecture services","products":"","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"04:30 PM","end":"05:30 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath
