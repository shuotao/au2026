":"Small Business","speakers":"Howard Munsell; Matthew Preston; John Selbe","abstract":"Opinions can be wonderful things. Don’t rule anything out because you’ve never tried it before. From the best use of curtain walls to using AI and cloud services, everyone has their own opinions on how things should be done. Some work. Some work better. Some don’t work at all. Follow along as we discuss and flesh out workflows and some best practices. A lot of these are tools you use every day when designing and innovating. But are you using them correctly? Is there something else you could be doing, or is there a better way to do it? Join Matt Preston and Howard Munsell as they provide their unique perspectives on daily tools.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610785521001bQVd"},{"code":"CES2338-D","title":"Unlocking the CADD Manager’s Bag: What's Inside? Keys to Navigate Disruption and Speed Transformation.","type":"Strategy Talk - Digital","track":"AutoCAD & General Design","industry":"Civil infrastructure","products":"None","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"04:30 PM","end":"05:30 PM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"Executive & Decision Maker","speakers":"Joseph Gaffney","abstract":"Today’s CADD manager isn’t carrying the same old bag. Step inside the modern toolkit where digital strategy, change leadership, and transformation know-how sit right alongside technical expertise. This fast‑paced, story‑driven session will reveal how CADD managers across industries are shedding the “CAD cop” stereotype and emerging as influential technology leaders who shape business outcomes. You’ll hear examples of teams that moved from reactive chaos to confident, future‑focused momentum by redefining the role and embracing disruption. If you’re ready to elevate your impact and lead your organization through digital change with clarity and confidence, this session will show you exactly what’s possible—and what belongs in your upgraded bag.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1775422307288001MDoP"},{"code":"4696-D","title":"Innovators Stage | AECO Design Slam: Designing the Future of Event Cities","type":"Activity","track":"","industry":"","products":"","duration":"1 hr 30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"05:00 PM","end":"06:30 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"","speakers":"Jake Storey; Ali Nasiri; Thesla Collier; Matt Menendez; Philip Ra","abstract":"\u003cp>Can great urban design turn a global event into a permanent destination? Watch two teams compete live as they reimagine the corridor between Allegiant Stadium and the Las Vegas Strip into a climate-smart, hospitality-driven district designed for the FIFA World Cup™ and beyond. Using Autodesk Forma, Forma Building Design, sustainability analysis, and AI visualization, competitors will create bold concepts that improve mobility, enhance the fan experience, and deliver lasting value for residents and visitors. You'll see every decision happen live—and cast the vote that crowns the Design Slam champion.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1784035361110001hTEe"},{"code":"FTV2364-D","title":"One Shader to Rule Them All: Universal Lookdev with MaterialX and LookdevX in Maya","type":"Technical Deep Dive - Digital","track":"Media & Entertainment","industry":"Film and TV","products":"3ds Max 2; Arnold; Maya","duration":"1 hr","day":"Wednesday (16th)","date":"2026-09-16","start":"08:00 AM","end":"09:00 AM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"Designer, Engineer & Specialist; Small Business","speakers":"Kaan Zorlu","abstract":"The era of \"siloed\" shading is over. As pipelines move toward OpenPBR and MaterialX, artists must learn to build materials that are platform-agnostic. This session will explore the power of LookdevX in Maya 2026 software for creating high-fidelity, universal shaders. We’ll break down how to move away from legacy shading networks toward a unified MaterialX workflow that ensures visual consistency across various renderers and applications. Explore the technical logic of LookdevX, learn how to use the new OpenPBR standard for both realism and stylization, and discover the secrets to \"packaging\" your lookdev so it survives the transition from Maya to the rest of your pipeline. Build once, render everywhere.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1775441042194001QPps"},{"code":"IM1347-D","title":"Operational Intelligence with Autodesk Tandem: Driving Maintenance ROI from Digital Twins","type":"Strategy Talk - Digital","track":"Capital Project Owners & Operators","industry":"Industrial machinery","products":"Docs; Tandem Connect","duration":"30 min","day":"Wednesday (16th)","date":"2026-09-16","start":"08:00 AM","end":"08:30 AM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"Executive & Decision Maker","speakers":"Saverio Camillo Saviello","abstract":"Digital twins offer operational insight, yet their value is often unrealized when data remains disconnected from daily operational workflows. Asset models exist, but maintenance decisions, cost analysis, and ticket creation still happen in separate systems, limiting adoption and measurable ROI. This session will explore how integrating Autodesk Tandem with maintenance operations transforms digital twins into practical decision-making tools. We’ll show how you can calculate maintenance ROI by correlating maintenance costs, downtime, and potential fault costs using AI, and how these insights accelerate maintenance ticket creation and support predictive, data-driven strategies.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1774256838562001AFUY"},{"code":"AU3443-D","title":"Whodunit? Building a System That Remembers Every Hand in the Work.","type":"Strategy Talk - Digital","track":"Inclusive Innovation, Culture, & Belonging","industry":"Other","products":"None","duration":"30 min","day":"Wednesday (16th)","date":"2026-09-16","start":"08:00 AM","end":"08:30 AM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"Educator & Workforce Builder","speakers":"Renee Dua","abstract":"Creative work is always collaborative. But the record rarely reflects that. Fabricators, assistants, mentors, and technicians disappear from the story—while credit consolidates around whoever has the loudest voice. This session will introduce ETCH, a trust-based documentation platform built on a custom blockchain, designed to make invisible labor visible. We'll walk through the design problems that shaped the system and discuss how to document a messy, nonlinear process. How do you attribute equitably across skill types? How do you build trust without financial incentives? The answer is a working system built by a design student who got frustrated enough to build the thing they needed.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1775580654861001pa97"},{"code":"WP1007-D","title":"Community watching party: Day 2 Keynote en Español","type":"Watch Party","track":"","industry":"","products":"","duration":"2 hr","day":"Wednesday (16th)","date":"2026-09-16","start":"09:00 AM","end":"11:00 AM","mode":"Live","featured":"","tabs":"Community, Live-streamed","learningPath":"Small Business","speakers":"María Lucrecia Real; Brenda Chiquito; Juan Francisco Angel; Arturo Polanco; Gustavo Ubriaco Contreras; Didier Raphael Ramirez Darjo; Elmer Muñoz","abstract":"\u003cp>¡Hola a todos y a todas!\u003cbr/>\u003cbr/>\u003c/p> \u003cp>Desde la Comunidad en Español, os invitamos a que te sumes a ver la sesión Industry Keynote de Autodesk University en Comunidad y con subtítulos en español.\u003cbr/>\u003cbr/>\u003c/p> \u003cp>Acompañados por varios miembros del programa Expert Elite, como Lucrecia Real, Gustavo Ubriaco, Didier Ramírez Carolina Ramírez, Arturo Polanco, Brenda Chiquito, Elmer Muñoz y Juan Francisco Ángel, acompañados del Community Manager de Autodesk en Español, Joaquim Moral, súmate a la sala de Zoom dónde juntos podremos ver esta sesión y conversar vía chat en directo.\u003cbr/>\u003cbr/>\u003c/p> \u003cp>¡Nos vemos!\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783353512300001boxg"},{"code":"WP1008-D","title":"Community watching party: Day 2 Keynote en Français","type":"Watch Party","track":"","industry":"","products":"","duration":"2 hr","day":"Wednesday (16th)","date":"2026-09-16","start":"09:00 AM","end":"11:00 AM","mode":"Live","featured":"","tabs":"Community, Live-streamed","learningPath":"Small Business","speakers":"Patrick EMIN; Jacques Rigal","abstract":"Bonjour à toutes et à tous, La communauté francophone Autodesk vous invite à nous rejoindre pour suivre ensemble le keynote AECO de l’Autodesk University, avec des sous-titres en français. Aux côtés de Manon Puel, Community Manager Autodesk France, retrouvez-nous dans une salle Zoom dédiée pour visionner cette session en direct, partager vos réactions et échanger avec les autres participants via le chat. À bientôt !","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783353512440001bgsx"},{"code":"WP1010-D","title":"Community watch party: Day 2 Keynote in English by The Big Room","type":"Watch Party","track":"","industry":"","products":"","duration":"2 hr","day":"Wednesday (16th)","date":"2026-09-16","start":"09:00 AM","end":"11:00 AM","mode":"Live","featured":"","tabs":"Community, Live-streamed","learningPath":"Small Business","speakers":"","abstract":"Hello everyone! We invite you to join us for the Day 2 Keynote, live from AU 2026 in Las Vegas. Join us in the Zoom room with several members of the Expert Elite program and Autodesk's Community Manager, Alex Eckhart. We'll be watching this session together and chatting live.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783353512653001bkLk"},{"code":"KEY1002-D","title":"Day 2 Keynote","type":"Keynote","track":"","industry":"","products":"","duration":"1 hr 45 min","day":"Wednesday (16th)","date":"2026-09-16","start":"09:00 AM","end":"10:45 AM","mode":"Live","featured":"Yes","tabs":"Featured, Live-streamed","learningPath":"Designer, Engineer & Specialist; Educator & Workforce Builder; Executive & Decision Maker; Growing Team Leader; Small Business","speakers":"Andrew Anagnost; Amy Bunszel; Diana Colella; Stephen Hooper; Jeff Kinder","abstract":"Hear from Autodesk’s industry leaders as they bring Autodesk’s AI into sharper focus through the lens of your industries: design and manufacturing; architecture, engineering, construction; operations; and media and entertainment. Learn how the capabilities introduced on Day 1 translate into real-world productivity gains, more connected workflows, and new opportunities for you to create and build more.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783521163092001sKDE"},{"code":"BES2649-D","title":"AECO Roadmap: Vision and Strategy","type":"Roadmap","track":"","industry":"Engineering service providers","products":"","duration":"1 hr","day":"Wednesday (16th)","date":"2026-09-16","start":"11:30 AM","end":"12:30 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Executive & Decision Maker","speakers":"Nicolas Mangon","abstract":"\u003cp>The AECO industry is entering a new era where granular data, connected workflows, and AI are transforming how projects are planned, delivered, and operated. This session explores Autodesk’s AEC vision for a unified cloud foundation that helps teams define outcomes earlier, carry context across the lifecycle, and make better decisions from day one. With a focus on outcome-based BIM, Autodesk is advancing an approach where data is more meaningful, accessible, and actionable. This enables stronger alignment, better visibility, and improved coordination, while laying the groundwork for intelligent guidance and automation across the project journey.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610786769001boCu"},{"code":"AU4257-D","title":"Autodesk Fusion Roadmap","type":"Roadmap","track":"Design & Engineering","industry":"","products":"","duration":"1 hr","day":"Wednesday (16th)","date":"2026-09-16","start":"11:30 AM","end":"12:30 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Small Business","speakers":"Daniel Graham; Srinath Jonnalagadda; Jon den Hartog","abstract":"Explore the future of product development with Autodesk Fusion. This roadmap session will provide insight into where Fusion is headed across design, manufacturing, data, and AI-driven workflows. You’ll get an early look at upcoming innovations, strategic priorities, and how Autodesk is evolving Fusion to help teams work in a more connected, intelligent, and efficient way across the entire product development process. This session is ideal for anyone interested in understanding the future of Autodesk Fusion.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610786629001bl9K"},{"code":"CS3534-D","title":"Beyond the Migration: From Discovery to Momentum","type":"Strategy Talk","track":"Construction Management","industry":"Construction services","products":"","duration":"30 min","day":"Wednesday (16th)","date":"2026-09-16","start":"11:30 AM","end":"12:00 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Growing Team Leader","speakers":"David Smith","abstract":"Migrating an organization to Autodesk Forma (formerly Autodesk Construction Cloud) requires a sophisticated balance of technical automation and cultural change management. This session will explore the comprehensive migration journey at VanKirk Electric, focusing on the development of internal AI-assisted tools to automate legacy project transfers. We’ll detail how we addressed complex technical hurdles—such as long-file-path limitations—while coordinating across departments to ensure the new environment met the specific needs of every team. Furthermore, we’ll showcase our \"ACC Training Hub,\" a centralized Microsoft SharePoint ecosystem designed to drive high adoption rates through on-demand training, support ticketing, and peer-to-peer engagement forums.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610788333001b60N"},{"code":"AS3742-D","title":"From Intelligent Model to Environmental Outcomes: AI-Powered Tools for RE2020 Compliance","type":"Strategy Talk - Digital","track":"Impact & Sustainability","industry":"Architecture services","products":"Forma; Revit","duration":"1 hr","day":"Wednesday (16th)","date":"2026-09-16","start":"11:30 AM","end":"12:30 PM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"Executive & Decision Maker","speakers":"Alexandre PARENA","abstract":"How do you turn an intelligent model into a lever for real environmental performance? At the Chabanne office, we developed a suite of custom Revit plug-ins directly connected to live environmental databases (INIES/RE2020). This enabled our teams to query material carbon data, track biosourced ratios, and monitor energy indicators directly inside the model in real time. This outcome-based BIM helped us across different projects—especially Thoiry's Kindergarten—to reach Passivhaus-level energy needs, exceed the RE2020 2028 carbon threshold, and achieve 1.5 times the Level 3 biosourced label. Through Autodesk Platform Services, plug-ins, Autodesk Forma, Forma Site Design, Forma Building Design, Model Context Protocol (MCP), API, and AI, the intelligent model turned into a decision-making engine for our whole team.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1775595559923001sxn7"},{"code":"CS2138-D","title":"Innovators Stage | Skills to Pay the Bills: Creating Claude Skills for Autodesk Workflows","type":"Technical Deep Dive","track":"Autodesk Platform Services (APS)","industry":"Construction services","products":"Docs; Forma; Revit","duration":"30 min","day":"Wednesday (16th)","date":"2026-09-16","start":"11:30 AM","end":"12:00 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Designer, Engineer & Specialist; Educator & Workforce Builder; Small Business","speakers":"Anthony Sertorio","abstract":"Claude skills provide a standard way to create reusable capabilities that help AI complete complex tasks. This session will focus on creating skills that automate design and project delivery workflows in Autodesk. You’ll learn what a skill is, when it should be used instead of prompts or Model Context Protocols (MCPs), how to design skills that interact with Autodesk Platform Services and Autodesk Forma, and how to adopt these automations across an organization. We’ll explore how skills can be used together with tools like MCP and custom scripts, and we’ll build practical examples such as querying BIM metadata, automating design data checks, and producing design documentation.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105107992001PTot"},{"code":"FTV2122-D","title":"VRED to Flame using Python: Standardizing Image Pipelines from Render to Finishing","type":"Technical Deep Dive - Digital","track":"Media & Entertainment","industry":"Film and TV","products":"Flame; VRED","duration":"30 min","day":"Wednesday (16th)","date":"2026-09-16","start":"11:30 AM","end":"12:00 PM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"","speakers":"Mark Taylor; Ruediger Ambs","abstract":"\u003cp>Rendering Autodesk VRED scenes can result in Open EXR sequences that require manual handling before they can be used in Autodesk Flame. This creates delays, inconsistencies, and avoidable errors in high-end commercial finishing workflows. This session will discuss example pipelines using both VRED and Flame Python tools to render Open EXR sequences from VRED and ingest them into Flame as clips. We will cover render jobs, structuring output, managing naming, and simplifying Flame imports. You should leave with a repeatable, production-ready workflow that reduces manual ingest and connects visualization to finishing with speed and reliability.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1775213248407001zShd"},{"code":"GA2236-D","title":"Animation in Maya with AI: Creating a Game Cinematic with MotionMaker","type":"Technical Deep Dive - Digital","track":"Media & Entertainment","industry":"Games","products":"Maya; Maya Creative","duration":"1 hr","day":"Wednesday (16th)","date":"2026-09-16","start":"01:30 PM","end":"02:30 PM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"Educator & Workforce Builder; Small Business","speakers":"Marcio Goncalves","abstract":"MotionMaker is an exciting new feature released with Maya 2026 software. It uses the power of AI to help 3D artists animate characters and creatures quickly and efficiently. This is AI at its best—not trying to replace the 3D artists but helping them. This class will introduce you to MotionMaker and teach you how to use it to create an exciting game cinematic. First, you’ll learn what MotionMaker is and how it compares to other tools. Then, you’ll learn the basic elements and components of the MotionMaker interface. Finally, we’ll use MotionMaker to create an exciting game cinematic, taking advantage of the three proxy characters available (biped, canine, and horse)—and then we’ll export the game cinematic to a game engine.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1775259884550001Gi83"},{"code":"AU4626-D","title":"Designing 3D Spaces using AI World Models","type":"Strategy Talk","track":"Future Industry Innovations","industry":"Other","products":"","duration":"1 hr","day":"Wednesday (16th)","date":"2026-09-16","start":"01:30 PM","end":"02:30 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"","speakers":"Ben Mildenhall","abstract":"\u003cp>Existing AI image and video models allow for rapid iteration from text or concepts to images and videos but can only produce 2D outputs allowing for limited downstream interaction and editing. World models such as World Labs’ Marble can create complete and visually rich 3D environments in minutes from just a handful of real images, concept sketches, 360 panoramas, or a 3D layout. This session will walk through a variety of workflows combining AI image models and Marble together to rapidly build, edit, and visualize 3D worlds, as well as ways to export the resulting 3D Gaussian splat files into other tooling for further iteration.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1785873429262001Iesw"},{"code":"FTV2029-D","title":"From Image to Groom: AI Workflows for Production-Ready Character Hair","type":"Strategy Talk - Digital","track":"Media & Entertainment","industry":"Film and TV","products":"Maya","duration":"30 min","day":"Wednesday (16th)","date":"2026-09-16","start":"01:30 PM","end":"02:00 PM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"","speakers":"Hilmar Koch; Derek Cheung","abstract":"As media and entertainment pipelines accelerate, digital hair creation still requires hours of work, with artists meticulously crafting guide curves and tuning modifiers to match reference. This session will demonstrate a research prototype of an AI-powered tool for Maya software that converts one or more images into fully editable grooms. We’ll show how this approach reduces grooming time by up to five times through automation of repetitive work, and how it integrates with simulation and downstream departments. We’ll also detail our wholly owned, synthetic data strategy for training AI models designed for transparency and control. See this workflow in action and understand how image-to-groom can accelerate your character production workflows.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1775145808816001SYOn"},{"code":"CES2193-D","title":"Innovators Stage l AutoCAD and Autodesk Forma: A CAD Manager's Playbook for Connected Project Data","type":"Technical Deep Dive","track":"AutoCAD & General Design","industry":"Civil infrastructure","products":"AutoCAD; AutoCAD LT; Civil 3D","duration":"1 hr","day":"Wednesday (16th)","date":"2026-09-16","start":"01:30 PM","end":"02:30 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Small Business","speakers":"Amarjeet Sonkar; Damian Willcox","abstract":"Autodesk Forma Data Management Essentials is now included with stand-alone AutoCAD subscriptions, connecting desktop design workflows to unified, cloud-based project data without changing how your team works. In this technical deep dive, we’ll show CAD managers how to turn fragmented file management into integrated workflows that reduce friction and accelerate delivery for your teams. We’ll look at Connected Support Files for project-aware support files that load automatically, Connected References that fixes broken xrefs, Connected Sheet Set Manager, Checkout, and much more.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105109119001Pdt9"},{"code":"FTV2609-D","title":"Nightmares in Motion: Animating the Creatures of IT in Welcome to Derry","type":"Technical Deep Dive - Digital","track":"Media & Entertainment","industry":"Film and TV","products":"Maya","duration":"30 min","day":"Wednesday (16th)","date":"2026-09-16","start":"01:30 PM","end":"02:00 PM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"","speakers":"Scott Holmes","abstract":"Few characters in modern horror are as unpredictable as Pennywise, whose terrifying transformations lie at the heart of IT: Welcome to Derry. In this session, Rodeo FX Animation Supervisor Scott Holmes will reveal how the team used Maya software to design rigs and craft performances for Pennywise’s many monstrous forms. Through production examples and animation breakdowns, the talk will explore the creative process behind building creatures that can shift from subtle unease to full nightmare, while remaining believable, expressive, and terrifying on screen.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1775495449658001tn83"},{"code":"AS3057-D","title":"AEC Roadmap: Architecture","type":"Roadmap","track":"","industry":"Architecture services","products":"","duration":"1 hr","day":"Wednesday (16th)","date":"2026-09-16","start":"03:00 PM","end":"04:00 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"","speakers":"Lauren Poon; Matt Arsenault; Daniel Gameiro; Andrea Vallés","abstract":"\u003cp>Designing for impact means designing with agility, insight, and collaboration. In this session, Autodesk product and strategy leaders will share what’s new, and what’s coming next, for architects across Autodesk Forma, Revit, and Autodesk’s cloud collaboration tools. Learn how we’re advancing workflows from planning and schematic design to performance analysis, documentation, and multidisciplinary coordination. See how deeper connections between desktop tools and the Forma industry cloud, through the Forma Connected Client initiative, can help teams move data, context, and insights across solutions, reducing rework, supporting sustainability, and unlocking creativity.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610785873001b0c0"},{"code":"AS3135-D","title":"An Owner’s Digital Blueprint for Airports: Mandated BIM, GIS‑Led Master Planning, and Digital Twins","type":"Strategy Talk","track":"Infrastructure Owners","industry":"Architecture services","products":"Build; Docs for Government; Dynamo","duration":"30 min","day":"Wednesday (16th)","date":"2026-09-16","start":"03:00 PM","end":"03:30 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Executive & Decision Maker; Growing Team Leader","speakers":"Rahul Khanna; Malishka Gupta","abstract":"Adani Airport Holdings Limited (AAHL) is building a unified digital ecosystem by mandating BIM across all projects and adopting geographic information system (GIS) as the foundation for master planning. Progress toward digital twins is independently certified through global, standards‑driven bodies such as the BSI Kitemark. AAHL is proud to have the world’s first and second airports certified to BSI Kitemark Stage 2 for Design and Construction, and to be the first organization globally with all seven airports achieving Stage 3. This session will demonstrate how scan‑to‑BIM and full airside scan‑to‑GIS establish accurate digital baselines to govern and protect the aerodrome, improving design coordination, safety compliance, and operational and long‑term expansion through BIM‑GIS integration.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1784145829330001IVK4"},{"code":"CS2019-D","title":"Innovators Stage | Autodesk Forma Jeopardy!","type":"Spark Session","track":"Construction Management","industry":"Construction services","products":"","duration":"1 hr","day":"Wednesday (16th)","date":"2026-09-16","start":"03:00 PM","end":"04:00 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Small Business","speakers":"Danielle Foss","abstract":"Calling all game show enthusiasts—come participate in an Autodesk Forma-focused game of Jeopardy, where you can test your knowledge of the platform and pick up new tips and insights. We’ll cover AI capabilities, workflows from planning to operations, newly launched features, and more. This session is for everyone, from Forma novices wanting to learn more to seasoned experts eager to test their skills. Structured like the US game show, audience members can “buzz in” to answer questions, accumulate points, and compete for prizes. In this session, we’ll showcase Autodesk Forma capabilities in an interactive and fun format. Expect to walk away with fresh insights and practical applications to deliver your projects more efficiently.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610787991001bOvk"},{"code":"CES1594-D","title":"Tangled Up in Blue: Untangling a ProjectWise Migration to Autodesk Forma","type":"Strategy Talk","track":"Civil Engineering","industry":"Civil infrastructure","products":"","duration":"1 hr","day":"Wednesday (16th)","date":"2026-09-16","start":"03:00 PM","end":"04:00 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Educator & Workforce Builder","speakers":"Sean Hulbert; Andy Bosch","abstract":"When the project teams saw files taking up to 45 minutes to open and AutoCAD crashes becoming routine, they knew their platform was failing them and driving project costs higher. Adding to the pressure, the project was advancing from 60% to 90% plan submittals, a stage when most avoid major platform changes. Migrating off ProjectWise meant transitioning roughly 14,000 files and enabling more than 300 users and 10 subconsultants—while keeping design moving forward. This session will show how the Blue Line Light Rail project, a 13-mile corridor, was transitioned to Autodesk Forma (formerly Autodesk Construction Cloud). Learn how a strong proof of concept, Civil 3D workflows, Autodesk-developed tools (including the bulk migration tool), and external Civil 3D tools helped identify and resolve issues during a midproduction migration.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610787312001bbjR"},{"code":"BLD1842-D","title":"What’s New in Revit 2027.x: AI, Data, and Connected Workflows","type":"Technical Deep Dive","track":"Architecture","industry":"Buildings","products":"Forma; Forma Data Management Essentials; Model Coordination; ReCap; Revit","duration":"1 hr","day":"Wednesday (16th)","date":"2026-09-16","start":"04:00 PM","end":"05:00 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Designer, Engineer & Specialist; Small Business","speakers":"Scott D Davis; Dan Peticila; Cesar Escalante","abstract":"Revit 2027 software advances a more connected, data-driven BIM workflow, linking design, analysis, and documentation with the Autodesk Forma (formerly Autodesk Construction Cloud) ecosystem. In this session, Revit product managers will demonstrate how AI-powered assistance, extended cloud data, and collaborative carbon insights transform everyday production workflows. Learn how Autodesk Forma Carbon Insights connects Revit models to shared sustainability dashboards, how extended properties bring cloud-managed data directly into the model, and how automation and performance improvements accelerate documentation. See how connected workflows reduce rework, improve decision making, and align multidisciplinary teams from early design through detailed delivery.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105101897001PmOP"},{"code":"GA1559-D","title":"Advanced Maya and Unreal Integration for Game Cinematics: Motion Capture, Characters, and VFX","type":"Technical Deep Dive - Digital","track":"Media & Entertainment","industry":"Games","products":"Maya; Maya Creative","duration":"30 min","day":"Wednesday (16th)","date":"2026-09-16","start":"04:30 PM","end":"05:00 PM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"Educator & Workforce Builder","speakers":"Marcio Goncalves","abstract":"This class will present an intermediate-to-advanced workflow integrating Maya software and Unreal Engine software to create more-complex and exciting game cinematics—including characters animated with motion capture, manually animated vehicles, particles, and dynamics. This class will show you how to create and layout an advanced game cinematic in Maya, preparing it for export to Unreal Engine. Then we will show you how to import and set up the exported Maya scene in Unreal Engine, setting up materials, cameras, mocap, particles, and dynamics. Finally, we’ll implement industry-standard best practices while working between Maya and Unreal Engine, and rendering the final cinematic in Unreal Engine. This hands-on class has the indie game dev and 3D artist in mind.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1774590021132001mYVj"},{"code":"AU2135-D","title":"AEC Roadmap: AutoCAD","type":"Roadmap","track":"AutoCAD & General Design","industry":"Other","products":"","duration":"30 min","day":"Wednesday (16th)","date":"2026-09-16","start":"04:30 PM","end":"05:15 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Small Business","speakers":"Dan Whitcombe; Tedman Martinez; Anum Mithani; Shiva Kashalkar","abstract":"Get a front-row seat to what’s next for AutoCAD software. In this session, the AutoCAD product team will walk you through the latest enhancements and offer a preview of upcoming features that are redefining design and drafting. From improved collaboration tools to AI-powered productivity boosts, you’ll see how Autodesk is evolving AutoCAD to meet the needs of today’s and tomorrow’s complex projects. You’ll also get insight into the product strategy guiding our development, and see how your feedback is helping shape what’s coming next.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610786489001beBl"},{"code":"CS1257-D","title":"Driving Certainty On-Site: 4D Workflows for Program, Progress, and Risk to Managing Contractors","type":"Technical Deep Dive - Digital","track":"Autodesk Platform Services (APS)","industry":"Construction services","products":"3ds Max 2; Docs; Revit","duration":"1 hr","day":"Wednesday (16th)","date":"2026-09-16","start":"04:30 PM","end":"05:30 PM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"Designer, Engineer & Specialist","speakers":"Quoc Pham; Nathan Love","abstract":"A key industry challenge is accessing reliable, real‑time progress data, which is critical to reducing the risk of project overruns and cost escalation. This presentation will show how managing contractors can use data within design models and Autodesk Forma to deliver effective 4D workflows. We’ll showcase practical uses of Autodesk Forma and Revit software to plug into construction software that provides more-accurate site data, enabling teams to confidently measure progress against program.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1773883449806001l9wr"},{"code":"CES1467-D","title":"Generative Design for Smart Catenary Systems Using Adaptive Parametric Families","type":"Technical Deep Dive","track":"Civil Engineering","industry":"Civil infrastructure","products":"","duration":"1 hr","day":"Wednesday (16th)","date":"2026-09-16","start":"04:30 PM","end":"05:30 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Designer, Engineer & Specialist","speakers":"Ayman SALEH","abstract":"Designing overhead catenary systems is highly constrained and repetitive. This session will introduce a generative workflow that automates catenary design using an advanced Revit adaptive parametric family capable of handling more than 350,000 configuration combinations. The family embeds engineering logic and formulas that evaluate geometry, spans, clearances, and structural conditions to automatically select the optimal mast configuration. Attendees will learn how Generative Design or Dynamo drives this parametric engine, enabling the model to adjust the catenary mast as track geometry changes. The result is a smart, self‑adapting catenary system that reduces manual work and increases design reliability across long rail corridors.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610787150001bmRQ"},{"code":"4728-D","title":"Innovators Stage I Hybrid Intelligence and a Pro-Social AI Future","type":"Strategy Talk - Panel","track":"Inclusive Innovation, Culture, & Belonging","industry":"","products":"","duration":"45 min","day":"Wednesday (16th)","date":"2026-09-16","start":"04:30 PM","end":"05:15 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"","speakers":"Cornelia walther; Maxim Williams; Mike Haley; Heather McIntosh Cassano","abstract":"Artificial intelligence is reshaping how we design, build, manufacture, and create. But as AI becomes more capable, the most important question isn't what AI can do, it's how people and organizations can use it to amplify human potential. Autodesk’s Mike Haley (SVP, Research, Autodesk) and Heather McIntosh Cassano (VP, User Experience, AEC Solutions) will engage in a conversation with Dr. Cornelia Walther on how AI is rapidly changing the ways we work, collaborate, and what it means culturally as it's used to solve and innovate on increasingly complex challenges. The conversation will be moderated by Maxim Williams (VP, Global Culture and Belonging, Autodesk). Together, the panel will explore the meaning of pro-social AI and hybrid intelligence, where combining human judgment with artificial intelligence can create better human centered outcomes for individuals, businesses, and society. Attendees will leave with practical insights into how leaders, teams, and practitioners can navigate AI responsibly while maximizing its potential to unlock innovation, creativity, and opportunity. This session is sponsored by Autodesk Global Culture & Belonging team.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1785963134578001ywgK"},{"code":"WP1006-D","title":"Community watching party: Day 1 Keynote in Korean","type":"Watch Party","track":"","industry":"","products":"","duration":"2 hr","day":"Thursday (17th)","date":"2026-09-17","start":"04:00 AM","end":"06:00 AM","mode":"Live","featured":"","tabs":"Community, Live-streamed","learningPath":"Small Business","speakers":"","abstract":"안녕하세요 여러분! 한국 커뮤니티를 위해 Autodesk University 기조연설(한국어 자막 포함)을 함께 시청하는 자리를 마련했습니다. Expert Elite 프로그램의 여러 멤버와 한국어권 커뮤니티 담당 Autodesk 커뮤니티 매니저도 함께할 예정입니다. Zoom 회의에 참여하셔서 세션을 함께 시청하고 실시간으로 대화도 나누어 보세요. 그때 뵙겠습니다!","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783353512175001buzr"},{"code":"WP1005-D","title":"Community watching party: Day 1 Keynote in Chinese","type":"Watch Party","track":"","industry":"","products":"","duration":"2 hr","day":"Thursday (17th)","date":"2026-09-17","start":"04:00 AM","end":"06:00 AM","mode":"Live","featured":"","tabs":"Community, Live-streamed","learningPath":"Small Business","speakers":"","abstract":"大家好！ 来自中文社区的我们诚挚邀请您一同观看Autodesk University主会场直播，配有中文字幕，并与社区一起交流互动。 届时将有多位Expert Elite计划成员和Autodesk中文社区经理 Linjie Zhang共同参与。欢迎加入我们的 Zoom 会议室，与我们一起观看并通过实时聊天互动！ 不见不散！","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783353512028001bXbT"},{"code":"BES3035-D","title":"Beyond Automotive: Scaling Autodesk VRED for Industrial Design Reviews","type":"Technical Deep Dive - Digital","track":"XR","industry":"Engineering service providers","products":"Inventor Professional; VRED Design; VRED Presenter; VRED Professional","duration":"1 hr","day":"Thursday (17th)","date":"2026-09-17","start":"08:00 AM","end":"09:00 AM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"","speakers":"Prashant Kalyani; AkshayKumar Pawar","abstract":"\u003cp>Autodesk VRED is well known in automotive, but the same real-time visualization workflow can accelerate collaboration across industrial manufacturing. This Technical Deep Dive shows how teams can use VRED, Python scripting, and immersive reviews to create shared virtual prototypes for switchgear, pumps, and engineered products. Attendees will see how to structure review sessions, add scripted interactions, validate design intent before physical build, and shorten feedback cycles across design, engineering, and program teams.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1775545956165001lDyI"},{"code":"BES2247-D","title":"Building MEP Automation Tools with pyRevit: Real Examples from High-Rise Project Delivery","type":"Technical Deep Dive - Digital","track":"MEP Engineering & Fabrication","industry":"Engineering service providers","products":"Revit","duration":"30 min","day":"Thursday (17th)","date":"2026-09-17","start":"08:00 AM","end":"08:30 AM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"Educator & Workforce Builder; Small Business","speakers":"Zaid Fahed","abstract":"As MEP engineers, we spend too much time on repetitive tasks that could be automated. In this session, we’ll show how we used pyRevit at KEO International Consultants to build custom automation tools inside Revit software, transforming our workflow on high-rise projects. Using two real tools as examples—a chilled water pipe autosizer based on pressure drop criteria (150-300 Pa/m) and a domestic water pipe autosizer following CIBSE Guide G—we’ll demonstrate how pyRevit can automate complex MEP tasks in a single click. This session is for MEP engineers and BIM managers who want to build their own automation tools, regardless of programming background.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1775305826464001ptxz"},{"code":"CS4095-D","title":"Connected Preconstruction: BuildingConnected Workflows in Autodesk Forma","type":"Technical Deep Dive","track":"Preconstruction","industry":"Construction services","products":"Build; Forma; TradeTapp","duration":"1 hr","day":"Thursday (17th)","date":"2026-09-17","start":"08:30 AM","end":"09:30 AM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Small Business","speakers":"Samira Tily; Cory Kintz; Ariel Castillo","abstract":"BuildingConnected has long been the backbone for bid management and subcontractor qualification at Miller Davis. As early beta users, Miller Davis has worked closely with Autodesk to test workflows that bring BuildingConnected into Autodesk Forma alongside Autodesk Forma Takeoff and Autodesk Forma Estimate. The Miller Davis team will share how Forma Bid helps reduce tool fragmentation and keeps preconstruction work connected within a single environment. We’ll discuss lessons learned from early adoption, and we’ll walk through familiar workflows reimagined in Forma—including RFP management, multiple proposals per project, bidder recommendations, qualification insights, bid leveling, and flexible reporting. The Autodesk product team will join to support the discussion.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105143586001Pvfl"},{"code":"TR1702-D","title":"Rivian’s Digital Twin Strategy: Turning Asset Data into a Product, Not a Byproduct","type":"Technical Deep Dive","track":"Preconstruction","industry":"Automotive and other transportation","products":"","duration":"1 hr","day":"Thursday (17th)","date":"2026-09-17","start":"08:30 AM","end":"09:30 AM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Growing Team Leader","speakers":"Derek Milz","abstract":"Rivian is bridging the gap from Autodesk Forma (formerly Autodesk Construction Cloud) to a full-scale digital twin by treating asset data as a product—not a byproduct. In this session, we’ll show you how assets are structured in Autodesk Forma, live-linked to model elements in Autodesk Tandem using Tandem Connect, and integrated with enterprise resource planning (ERP) and computerized maintenance management system (CMMS) systems to form a single, reliable asset backbone. We’ll break down the data standards, ID strategy, and integration patterns that connect design, construction, and operations. Using real examples unique to Rivian manufacturing plants, we’ll share lessons learned from early pilots, and we’ll describe how we manage change so teams across design, field ops, maintenance, and finance can all trust and use the same digital twin.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610789260001bqNn"},{"code":"BES2632-D","title":"AECO Roadmap: Data Solutions","type":"Roadmap","track":"","industry":"Engineering service providers","products":"Forma Design Collaboration; Autodesk Platform Services; BIM Collaborate Pro; Forma; Model Analytics; Model Derivative API","duration":"1 hr","day":"Thursday (17th)","date":"2026-09-17","start":"10:00 AM","end":"11:00 AM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Growing Team Leader","speakers":"Eddy Krygiel; Shilpa Ghanmode; Paul Markovits","abstract":"\u003cp>The AEC Data Model is becoming the shared language that connects design, construction, and operations as AECO shifts from file-centric BIM to data-centric delivery. In this roadmap session, learn how Autodesk is unifying files, models, and granular data through Forma Data Management and the AEC Data Model, unlocking governance, automation, analytics, and data reuse. We’ll highlight what’s next across Content Catalog, Extended Properties, Model Analytics, Parameters Service, Forma Assets, Datum, and emerging capabilities such as Information Requirements, Asset Information Connector, and Asset Registry. The result? Teams can access, trust and connect data across the full asset lifecycle.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105118079001PeCB"},{"code":"TR3013-D","title":"Beyond 4D: Resource-Based Construction Simulation with FlexSim","type":"Technical Deep Dive - Digital","track":"Digital Factory","industry":"Automotive and other transportation","products":"Fusion Operations; Inventor; Inventor Professional; Manufacturing Data Exchange Utility","duration":"1 hr","day":"Thursday (17th)","date":"2026-09-17","start":"10:00 AM","end":"11:00 AM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"Educator & Workforce Builder","speakers":"Anitha c; AkshayKumar Pawar","abstract":"Traditional 4D workflows show sequence—but they rarely quantify how labor, equipment, and logistics decisions affect project performance. This technical deep dive will show how FlexSim extends construction simulation beyond schedule playback into resource-based decision support. Using a practical case study, you’ll learn how to connect schedule logic with crews, equipment, productivity assumptions, and site logistics. You’ll also see how to model the difference between resource-driven and time-bound activities. And you’ll understand how to compare workforce, equipment, and delivery scenarios before execution to identify bottlenecks and improve planning accuracy.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1775540797125001bMJq"},{"code":"AS3860-D","title":"Collaborative Multi-Agents for AEC: A New Way to Navigate Design Decisions","type":"Technical Deep Dive","track":"Future Industry Innovations","industry":"Architecture services","products":"Dynamo; Revit","duration":"1 hr","day":"Thursday (17th)","date":"2026-09-17","start":"10:00 AM","end":"11:00 AM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"","speakers":"Nikita Klimenko; Lorenzo Villaggi","abstract":"Achieving net-zero carbon in architecture, engineering, and construction (AEC) at scale can be complex, often requiring trade-offs between cost and carbon reduction goals, as well as new design approaches and workflows. Collaborative multi-agent systems (MAS) can unlock new opportunities for these kinds of multi-objective problems. At Autodesk Research, we’re developing and testing agentic-based capabilities for design decision making, including defining design representations for automated design exploration, navigating metrics trade-offs, and sharing design tasks. This talk will present our findings and demonstrate how they can be applied to real-world projects, as demonstrated through our partnership with LA28.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105139588001P3VU"},{"code":"TR1657-D","title":"From Preparation to Production in Autodesk Fusion: Serial Additive Manufacturing for Automotive and Aerospace","type":"Technical Deep Dive - Digital","track":"Manufacturing Engineering","industry":"Automotive and other transportation","products":"Fusion; Inventor; Netfabb","duration":"30 min","day":"Thursday (17th)","date":"2026-09-17","start":"10:00 AM","end":"10:30 AM","mode":"On-demand","featured":"","tabs":"Digital only","learningPath":"Designer, Engineer & Specialist; Educator & Workforce Builder; Small Business","speakers":"Vasyl Tymoshchuk; Dmytro Mukhin","abstract":"This session will focus on serial additive manufacturing using Autodesk Fusion software, with practical insights into designing and producing functional parts. We’ll cover real-world use of FDM and SLA technologies, including workflows with UltiMaker and Formlabs printers, and working with high-performance, flame-retardant, and rigid materials. Key topics will include defining proper tolerances and clearances, optimizing designs for repeatable production, and preparing parts for testing and certification requirements. Special attention will be given to early-stage design decisions—including integration of assembly fixtures and quality control features—considering material behavior and process limitations.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1774815536783001LDCu"},{"code":"CES2161-D","title":"Building the Intelligent Catchment: Using InfoWorks ICM and AI to Create Cleaner, More Resilient Water Environments","type":"Technical Deep Dive","track":"Civil Engineering","industry":"Civil infrastructure","products":"","duration":"30 min","day":"Thursday (17th)","date":"2026-09-17","start":"11:30 AM","end":"12:00 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"","speakers":"Samer Muhandes; Tony Smithson","abstract":"The Only Rainwater into Windermere project represents a system-level approach aiming to stop sewage and highway runoff from entering England’s largest lake. This joint presentation between the project director and the InfoWorks ICM product manager will explain how InfoWorks ICM was used to produce site-specific analytics and potential solutions to inform intervention planning. We’ll present the project timeline, key modeling and data pipelines, methods used, and how these outputs were embedded into decision support tools for key decision makers. You’ll see a short technical demonstration of InfoWorks ICM workflows, and get a peek into the future of using AI prediction capabilities. A discussion of practical outcomes for the water sector will follow.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610787490001bc3e"},{"code":"AS2669-D","title":"Every Project Builds the Next: How Agentic AI Turns Design Projects into Software","type":"Strategy Talk","track":"Future Industry Innovations","industry":"Architecture services","products":"","duration":"30 min","day":"Thursday (17th)","date":"2026-09-17","start":"11:30 AM","end":"12:00 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"","speakers":"Brian Lee; Ray Wang","abstract":"\u003cp>Every design project starts almost from scratch — zoning analysis redone, energy models rebuilt, hard-won design logic left behind in last year's project folder. What if each previous project made the next one better? This session will present Autodesk Research's prototype system for agentic Design and Make. As you work through the different phases of a project, from conceptual design with physical models to collaborative design reviews with clients and engineers, the system captures your workflows and design knowledge as reusable software that compounds over time. When a new commission arrives with different requirements, that software comes with you, automatically adapting. Your firm doesn't just deliver results — it builds bespoke software that makes every project smarter than the last.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610785737001bgWE"},{"code":"AS3913-D","title":"Innovators Stage | Whose Model Is It Anyway? (Comedy Show)","type":"Spark Session","track":"Architecture","industry":"Architecture services","products":"","duration":"30 min","day":"Thursday (17th)","date":"2026-09-17","start":"11:30 AM","end":"12:00 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Designer, Engineer & Specialist","speakers":"Gil Cordle; Donnie Gladfelter; Steven Bloomer; Dzan Ta; Alex Eckhart; Kristina Youngblut","abstract":"Step into the hilarious side of CAD and BIM in this 30-minute comedy show! Hear stories of mysterious warnings, impossible client requests, chaotic models, and the kinds of design mishaps that make you laugh, wince, and nod in recognition. Packed with jokes, relatable chaos, and surprise twists, this show will celebrate the absurd, unpredictable, and sometimes ridiculous moments that happen behind every model. Whether you’re a designer, engineer, or project manager, you’ll leave entertained—and maybe even inspired to look at your own files a little differently.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610786072001bigK"},{"code":"BLD3895-D","title":"Digital Twins: Hot Takes and Cold Truths","type":"Spark Session","track":"Capital Project Owners & Operators","industry":"Buildings","products":"","duration":"30 min","day":"Thursday (17th)","date":"2026-09-17","start":"01:30 PM","end":"02:00 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"","speakers":"Iria Carreira; Karina Cardenas","abstract":"The audience for this session will be polled beforehand on digital twin hot takes and cold truths. Based on the results, former virtual design and construction (VDC) professionals working in the digital twin technology space will share a hot take and cold truth from their experiences. For example, a hot take is: \"You can build a digital twin with poor data quality, set goals with an emphasis on 3D visualization over operational outcomes, and do many pilot projects without scaling into broader operations.\" We’ll identify opportunities and share anecdotes on empowering owners, operators, and their design and construction partners to connect capital delivery and facilities operations through digital twins.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610786986001bLnf"},{"code":"AS2233-D","title":"Don’t Wait, Non-Revit Developers! Create Your Own Revit Add-Ins Using AI and the Revit API.","type":"Technical Deep Dive","track":"Community & Expert Elites","industry":"Architecture services","products":"Dynamo; Revit","duration":"1 hr","day":"Thursday (17th)","date":"2026-09-17","start":"01:30 PM","end":"02:30 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Small Business","speakers":"Marcello Sgambelluri","abstract":"Many Revit users have workflow wish list items that could automate repetitive tasks or add missing functionality. This class will show how to create Revit add-ins. Aimed at non-developers, we will cover add-in basics. We’ll also show how AI can help generate and refine code while users stay in control. You’ll learn enough to review results, test behavior, and improve tools step by step. No programming experience is required. By the end, you’ll understand how Revit add-ins work and how AI can help turn everyday workflow problems into useful custom tools.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105111379001PWUu"},{"code":"CS2875-D","title":"Innovators Stage | I'll Take \"Clash Detected\" for 400: An AECO Jeopardy Challenge","type":"Spark Session","track":"Construction Management","industry":"Construction services","products":"","duration":"30 min","day":"Thursday (17th)","date":"2026-09-17","start":"01:30 PM","end":"02:00 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Small Business","speakers":"Fabiane Amorim; Erica Bowman; Tanmay Bhalerao","abstract":"Think you know architecture, engineering, construction, and operations (AECO) workflows? Prove it. In this Jeopardy-style session, architects, engineers, contractors, and BIM managers will go head to head across categories like \"Clash Detected,\" \"Connect the Platforms,\" \"Coordination Gone Wrong,\" and \"Who Owns the Data?\" Audience members will compete live for a prize. And everyone will walk away with sharper cross-discipline instincts and a better understanding of where handoffs break down—and how integrated workflows fix them. Equal parts fun and educational, this session will turn real workflow pain points into a room full of engaged, competitive learners.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610788163001bxfW"},{"code":"CES3970-D","title":"Civil BIM Runway Digital Twin","type":"Technical Deep Dive","track":"Infrastructure Owners","industry":"Civil infrastructure","products":"","duration":"1 hr","day":"Thursday (17th)","date":"2026-09-17","start":"03:00 PM","end":"04:00 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"","speakers":"Clint Davis","abstract":"See how more than a decade of standardized design projects have been aggregated into a digital twin runway for one of the world’s busiest airports. How can owners use verified utility designs to drive maintenance and regulatory compliance? In Denver, we’re tracking sanitary sewer, storm sewer, aircraft de-icing fluid delivery and recovery, jet fuel, water, electrical duct banks, airfield lighting and signs, and pavement models to inform future design and current operations. As the puzzle comes together, see how we can visualize a clear picture of our infrastructure.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783610787656001bjQq"},{"code":"CES4124-D","title":"Overcoming the Seven Deadly Sins of Civil 3D Project Performance","type":"Technical Deep Dive","track":"Civil Engineering","industry":"Civil infrastructure","products":"Civil 3D","duration":"1 hr","day":"Thursday (17th)","date":"2026-09-17","start":"03:00 PM","end":"04:00 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Designer, Engineer & Specialist","speakers":"Donnie Gladfelter","abstract":"All you did was click “Open.” Now your fans are spinning at Mach 3D, and if your laptop were slightly more aerodynamic, it would likely defenestrate itself. Your Civil 3D project didn't slow down on its own. It was sinned against. None of it felt wrong at the time. Seven structural decisions are buried in your data management, file setup, and modeling workflows that Civil 3D punishes quietly and without warning until your 13-minute regen hits 42 minutes and sincity.dwg is due tomorrow. Donnie Gladfelter, Autodesk Expert Elite and AU Top Speaker, names the sins, earns each one its absolution—and sends you home with a project built the way Civil 3D actually wants to work. From first alignment to final handoff. Your laptop will thank you.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105144692001PYz6"},{"code":"CES2497-D","title":"Building Tomorrow: Mastering Project Delivery in the Age of Technology","type":"Strategy Talk","track":"Infrastructure Owners","industry":"Civil infrastructure","products":"Build; Docs; Forma","duration":"1 hr","day":"Thursday (17th)","date":"2026-09-17","start":"04:30 PM","end":"05:30 PM","mode":"Live","featured":"","tabs":"Live-streamed","learningPath":"Educator & Workforce Builder; Growing Team Leader","speakers":"Kelly Barber","abstract":"As Pennsylvania Department of Transportation (PennDOT) continues to navigate its digital transformation, the team is using Autodesk Forma as the digital backbone for their Project Delivery Collaboration Center (PDCC). Capitalizing on the flexibility and interoperability of the Forma environment, PennDOT is able to connect legacy system data. Learn how PennDOT uses Forma to manage design and construction projects, as well as for its connectivity to other off-the-shelf solutions. Learn how processes are being streamlined, time’s being saved, and project transparency is all accomplished through the rollout of PDCC. To showcase its benefits, PennDOT will be sharing the current use of PDCC on its projects and the road map to the future.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105114755001P3jw"},{"code":"CES2101-D","title":"Turning BIM into AI-Powered Digital Twins: Real-Time Predictive Maintenance with IoT","type":"Technical Deep Dive","track":"Civil Engineering","industry":"Civil infrastructure","products":"Forma Design Collaboration; Autodesk Platform Services; BIM Collaborate Pro; Docs; InfraWorks; Revit","duration":"1 hr","day":"Thursday (17th)","date":"2026-09-17","start":"06:00 PM","end":"07:00 PM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Tolga Bozkurt","abstract":"Intelligent models are often underused after design, remaining static and disconnected from real-world operations. This session will present a real-world deployment in a metropolitan rail system, where BIM is transformed into a live, AI-powered predictive maintenance platform. Using IFC-based workflows derived from Revit software, models are converted into lightweight, web-ready formats and integrated with Internet of Things (IoT) sensor data at the asset level. An AI layer enables anomaly detection and failure prediction, reducing unplanned downtime and improving maintenance efficiency. You will gain a practical understanding of how to extend BIM into an operational digital twin and implement scalable, data-driven maintenance strategies.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105106330001P9Wl"},{"code":"WP1009-D","title":"Community watching party: Day 2 Keynote in Ukrainian","type":"Watch Party","track":"","industry":"","products":"","duration":"2 hr","day":"Friday (18th)","date":"2026-09-18","start":"06:00 AM","end":"08:00 AM","mode":"Live","featured":"","tabs":"Community, Live-streamed","learningPath":"Small Business","speakers":"Anton Vasyliev; Oleksandr Kanivets","abstract":"Привіт всім! Від імені україномовної спільноти запрошуємо вас приєднатися до перегляду \"Industry Keynote\" в рамках Autodesk University 2026 разом із спільнотою та з коментарями українською мовою. Разом із кількома учасниками програми Expert Elite, а саме – Юрієм Подольчуком, Олександром Канівцем, Олексієм Соколовським, Анастасією Фещенко, Антоном Васильєвим, Олександром Черніковим, Андрієм Гуменюком та менеджером україномовної спільноти Autodesk, Дмитром Мухіним, приєднуйтесь до Zoom-кімнати, де ми разом подивимось цю сесію та поспілкуємося в чаті наживо. До зустрічі!","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783353512553001bQfc"},{"code":"WP1011-D","title":"Community watching party: Day 1 Keynote in German","type":"Watch Party","track":"","industry":"","products":"","duration":"2 hr","day":"Friday (18th)","date":"2026-09-18","start":"08:00 AM","end":"10:00 AM","mode":"Live","featured":"","tabs":"Community, Live-streamed","learningPath":"Small Business","speakers":"","abstract":"\u003cp>Hallo zusammen!\u003cbr/>\u003c\u003cbr/> Im Namen der deutschsprachigen Community laden wir euch herzlich ein, gemeinsam mit der Community die Autodesk University General Session anzusehen – mit Live-Kommentaren auf Deutsch.\u003cbr/>\u003cbr/> Gemeinsam mit mehreren Mitgliedern des Autodesk Expert Elite-Programms sowie dem Community Manager der deutschsprachigen Autodesk Community, Dmytro Mukhin, treffen wir uns in einem Zoom-Raum, um die Session gemeinsam zu verfolgen und uns live im Chat auszutauschen.\u003cbr/>\u003cbr/> Wir freuen uns auf euch!\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1786376809781001mpc8"},{"code":"4687-D","title":"Discover our Media and Entertainment Community - Creators","type":"Meetup","track":"","industry":"Other","products":"None","duration":"1 hr","day":"AU Group Network Meetup Chinese & French","date":"2026-09-22","start":"09:00 AM","end":"10:00 AM","mode":"On-demand","featured":"","tabs":"Community, Digital only","learningPath":"Small Business","speakers":"Felipe Fierro","abstract":"\u003cp>Want to connect with other creators, get inspired, and learn how to become more involved in the Autodesk community? Join our session to discover community initiatives, programs, and opportunities to participate, collaborate, and grow. Hosted by Joaquim Moral, Senior Community Manager at Autodesk for EMEA, LATAM, and M&E.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1785184830077001NEwy"},{"code":"4688-D","title":"Discover our Spanish and Portuguese Community & Groups (Sesión en Español con soporte en Portugués)","type":"Meetup","track":"","industry":"Other","products":"None","duration":"1 hr","day":"AU Group Network Meetup Spanish & Portuguese","date":"2026-09-23","start":"09:00 AM","end":"10:00 AM","mode":"On-demand","featured":"","tabs":"Community, Digital only","learningPath":"Small Business","speakers":"","abstract":"\u003cp>Want to connect with other creators, get inspired, and learn how to become more involved in the Autodesk community? Join this session, hosted in Spanish by Joaquim Moral, Senior Community Manager at Autodesk for EMEA, LATAM, and M&E. Portuguese support will also be available during the session.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1785185113838001SQ0g"}]</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const LS = 'au2026_stars';
// 沙箱預覽環境下 localStorage 可能拋 SecurityError，用安全存取層包住，避免中斷整個腳本
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
let stars = new Set();
try { const raw = store.get(LS); if (raw) stars = new Set(JSON.parse(raw)); } catch(e){}

const uniq = (arr) => [...new Set(arr.filter(Boolean))];
const isWeekday = d => /^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)/.test(d);
const daySel = document.getElementById('fDay');
uniq(DATA.map(d => d.day).filter(isWeekday)).forEach(d => {
  const o = document.createElement('option'); o.value = d; o.textContent = d; daySel.appendChild(o);
});
const typeSel = document.getElementById('fType');
uniq(DATA.map(d => d.type)).sort().forEach(t => {
  const o = document.createElement('option'); o.value = t; o.textContent = t; typeSel.appendChild(o);
});
const trackSel = document.getElementById('fTrack');
uniq(DATA.map(d => d.track)).sort().forEach(t => {
  const o = document.createElement('option'); o.value = t; o.textContent = t; trackSel.appendChild(o);
});

const el = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// PDT (UTC-7) -> Taiwan (UTC+8) = +15 小時；回傳「M/D HH:MM」含跨日
function toTW(dateStr, timeStr){
  const m = String(timeStr||'').match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(!m || !dateStr) return '';
  let h = parseInt(m[1],10); const min = parseInt(m[2],10); const ap = m[3].toUpperCase();
  if(ap==='PM' && h!==12) h+=12; if(ap==='AM' && h===12) h=0;
  const tw = h+15; const off = tw>=24?1:0;
  const d = new Date(dateStr+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+off);
  const p = d.toISOString().slice(0,10).split('-');
  return parseInt(p[1],10)+'/'+parseInt(p[2],10)+' '+String(tw%24).padStart(2,'0')+':'+String(min).padStart(2,'0');
}

function filtered(){
  const q = el('q').value.trim().toLowerCase();
  const day = daySel.value, mode = el('fMode').value, type = typeSel.value, track = trackSel.value;
  const feat = el('fFeat').checked, starOnly = el('fStar').checked;
  return DATA.filter(o => {
    if (day && o.day !== day) return false;
    if (mode && o.mode !== mode) return false;
    if (type && o.type !== type) return false;
    if (track && o.track !== track) return false;
    if (feat && !o.featured) return false;
    if (starOnly && !stars.has(o.code)) return false;
    if (q) {
      const hay = (o.code+' '+o.title+' '+o.speakers+' '+o.products+' '+o.track+' '+o.abstract).toLowerCase();
      if (!q.split(/s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  }).sort((a,b) => (a.date+a.start).localeCompare(b.date+b.start));
}

function render(){
  const rows = filtered();
  const live = rows.filter(r=>r.mode==='Live').length;
  el('stats').innerHTML = '符合 <b>'+rows.length+'</b> 筆' +
    (live ? '（Live <b>'+live+'</b> ｜ 隨選 <b>'+(rows.length-live)+'</b>）' : '') +
    '　·　已收藏 <b>'+stars.size+'</b> 筆';
  el('empty').style.display = rows.length ? 'none' : 'block';
  el('list').innerHTML = rows.map(o => {
    const on = stars.has(o.code);
    const isWk = /^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)/.test(o.day || '');
    const dayShort = isWk
      ? (o.day||'').replace(' (15th)',' 15').replace(' (16th)',' 16').replace(' (17th)',' 17').replace(' (18th)',' 18')
      : (o.date ? o.date.slice(5).replace('-','/') : '社群活動');
    return '<div class="card">' +
      '<div class="top">' +
      '<button class="star'+(on?' on':'')+'" data-c="'+esc(o.code)+'" title="收藏">'+(on?'★':'☆')+'</button>' +
      '<div class="body">' +
      '<a class="code" href="'+esc(o.url)+'" target="_blank">'+esc(o.code)+'</a>' +
      '<div class="title"><a href="'+esc(o.url)+'" target="_blank">'+esc(o.title)+'</a></div>' +
      '<div class="badges">' +
      '<span class="badge '+(o.mode==='Live'?'live':'ond')+'">'+(o.mode==='Live'?'LIVE 直播':'On-demand')+'</span>' +
      (o.featured?'<span class="badge feat">★ Featured</span>':'') +
      (o.type?'<span class="badge type">'+esc(o.type)+'</span>':'') +
      (o.track?'<span class="badge track">'+esc(o.track)+'</span>':'') +
      '</div>' +
      '<div class="meta2">'+esc(dayShort)+' <span class="sep">｜</span>'+esc(o.start)+'–'+esc(o.end)+' PDT' +
      (function(){ const tw=toTW(o.date,o.start); return tw ? ' <span class="sep">｜</span><b style="color:#1a7f4b">台灣 '+esc(tw)+'</b>' : ''; })() +
      (o.speakers?'<span class="sep">｜</span>講者：'+esc(o.speakers.split('; ').slice(0,3).join('、'))+(o.speakers.split('; ').length>3?' 等':''):'') +
      (o.products?'<span class="sep">｜</span>'+esc(o.products):'') +
      '</div>' +
      (o.abstract?'<details><summary>摘要</summary><div class="abstract">'+esc(o.abstract)+'</div></details>':'') +
      '</div></div></div>';
  }).join('');
}

document.getElementById('list').addEventListener('click', e => {
  const b = e.target.closest('.star');
  if (!b) return;
  const c = b.dataset.c;
  if (stars.has(c)) stars.delete(c); else stars.add(c);
  store.set(LS, JSON.stringify([...stars]));
  render();
});

['q','fMode','fType','fTrack'].forEach(id => el(id).addEventListener('input', render));
[fDay, el('fFeat'), el('fStar')].forEach(x => x.addEventListener('change', render));

function resetAll(){
  el('q').value=''; fDay.value=''; el('fMode').value=''; typeSel.value=''; trackSel.value='';
  el('fFeat').checked=false; el('fStar').checked=false; render();
}
el('btnReset').addEventListener('click', resetAll);

el('btnCsv').addEventListener('click', () => {
  const rows = filtered().map(o => Object.assign({}, o, { '台灣時間': toTW(o.date, o.start) }));
  const cols = ['code','date','day','start','end','台灣時間','title','type','mode','track','industry','products','speakers','abstract','url'];
  const esc2 = s => { s = String(s==null?'':s); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const csv = '\uFEFF' + [cols.join(',')].concat(rows.map(o => cols.map(c => esc2(o[c])).join(','))).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'au2026_digital_sessions_篩選結果.csv';
  a.click();
});

window.addEventListener('error', ev => {
  const box = document.getElementById('empty');
  if (box) { box.style.display = 'block'; box.innerHTML = '⚠️ 載入出錯：' + esc(ev.message) + '<br><span style="font-size:12px">（若為 localStorage 限制，收藏功能會自動停用，其餘仍可正常使用）</span>'; }
});

try { render(); }
catch (ev) {
  const box = document.getElementById('empty');
  if (box) { box.style.display = 'block'; box.innerHTML = '⚠️ 渲染出錯：' + esc(ev.message); }
  console.error(ev);
}
</script>
</body>
</html>
