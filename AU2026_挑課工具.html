<script id="data" type="application/json">[{"code":"MFG1914-D","title":"Accelerating Manufacturing Design: Unlocking the Top 10 Hidden Productivity Tools in AutoCAD Mechanical","type":"Technical Deep Dive","track":"AutoCAD & General Design","industry":"Manufacturing Other","products":"AutoCAD; AutoCAD Mechanical","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Small Business","speakers":"Sridhar Subramani","abstract":"Most manufacturing teams use AutoCAD daily but overlook the AutoCAD Mechanical toolset included in their subscription. This session will showcase 10 productivity features that cut repetitive drafting: intelligent commands with associative centerlines, automated hidden-line management, parametric content libraries, power dimensioning with tolerances, detail view automation, GD&T and welding symbols, integrated BOM with balloons, enterprise standards enforcement, built-in engineering calculators, and associative 2D documentation of Inventor 3D models. Through live demos and real-world scenarios, you’ll gain hands-on techniques to reduce cycle times, enforce ISO/ANSI compliance automatically, and bridge 2D-3D workflows using tools you already own.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105103005001PLwX"},{"code":"CS3038-D","title":"Agentic AI for AEC: Orchestrating Autonomous Project Delivery with Autodesk","type":"Technical Deep Dive","track":"Software Development","industry":"Construction services","products":"Forma; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Irene Won; Adam Sheather","abstract":"Agentic AI is rapidly changing how work gets done, moving beyond prompts into systems that can plan, act, and automate tasks across tools. This session will explore how to apply agent-based approaches using tools like Claude Code and Claude Cowork, Dispatch, and Model Context Protocol (MCP) with Autodesk Platform Services. In this session, you’ll learn how to connect agents to Autodesk data, manage authentication and permissions, and orchestrate workflows that automate design and project delivery tasks. Through practical examples, we’ll show how to combine agents, Claude skills, and APIs to move from isolated automations to scalable, end-to-end processes.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105126336001PpfR"},{"code":"BES1547-D","title":"Agentic AI Running Project Workflows in Autodesk Forma with MCP","type":"Technical Deep Dive","track":"Software Development","industry":"Engineering service providers","products":"Autodesk Platform Services; Forma; Forma Data Management Essentials","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Farzad Towhidi; Luis Salmeron","abstract":"This session will explore how PEC is implementing agentic AI to run real project workflows within Autodesk Forma (formerly Autodesk Construction Cloud). By using a Model Context Protocol (MCP) server as a governed orchestration layer, AI agents can securely connect to Autodesk APIs, query live project data, perform QA/QC checks, and execute tasks across project systems. You’ll see how this architecture moves beyond automation into true workflow execution—enabling scalable, consistent, and intelligent project delivery. We’ll share real-world examples, implementation strategies, and lessons learned to help teams begin adopting AI-driven workflows today.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105092955001PXJZ"},{"code":"AS3393-D","title":"Agentic Design Exploration: How LA28 and Autodesk","type":"Strategy Talk","track":"Impact & Sustainability","industry":"Architecture services","products":"","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Arthur Harsuvanakit","abstract":"Agentic design exploration marks a new frontier in sustainable architecture, shaped through partnerships like Autodesk and LA28. In this real-world case study, you’ll see how the approach aligned design, cost, and climate goals. By combining domain expertise with AI workflows, the team addressed ambitious targets using agent-based tools across the project's site, building, and assembly scales—integrating codes, performance, and program needs. These workflows enabled rapid generation and refinement of design options, helping identify high-performing, buildable solutions earlier, reducing carbon and costs. You’ll compare where AI-driven workflows succeed, where they fall short, and how to apply them at scale.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105132417001PTZE"},{"code":"BES4067-D","title":"Agents of Change: Mastering Agentic AI and MCP Workflows for the Multi-Discipline AEC Firm","type":"Strategy Talk","track":"Structural Engineering & Fabrication","industry":"Engineering service providers","products":"Docs; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Executive & Decision Maker","speakers":"Michael Gustafson; Andrew Sundal","abstract":"\u003cp>The AEC industry is undergoing a paradigm shift where the lines between software developers, industry groups, and design firms are blurring. This session explores how AI strategies are being collaboratively shaped to move beyond basic research into high-impact implementation within multi-discipline engineering environments. We will examine the evolution of AI maturity, moving from foundational context engineering to the deployment of agentic services and Model Context Protocols (MCPs) that automate complex engineering tasks. Drawing on real examples, business leaders will gain a clear view of the emerging landscape and a practical way to balance AI’s potential against the demands of modern design practice.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105142483001PUlQ"},{"code":"BLD2712-D","title":"AI Agents Meet APS: From Forma Building Design to Operational Digital Twin","type":"Strategy Talk","track":"Autodesk Platform Services (APS)","industry":"Buildings","products":"Autodesk Platform Services; Autodesk Viewer; Docs; Forma; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Frank Otto","abstract":"Most digital twin projects stall at the same point: There’s no 3D model. Point cloud scanning takes weeks—too heavy for operational use cases like workplace booking or shop-floor monitoring. But we’ve found a faster path: Design buildings in Autodesk Forma Building Design, process them server-side via the Autodesk Platform Services Automation API for Revit, then use agentic AI workflows via Model Context Protocol (MCP) to enrich the model with workplaces and connected production data. It takes hours instead of months. Through video walk-throughs and live demos, we’ll show two use cases we’re deploying this year—replacing our own third-party desk-sharing tool, and building a manufacturing digital twin. You’ll leave with a replicable pattern for AI-enabled design-to-operate workflows.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105120814001PDMS"},{"code":"BES3266-D","title":"AI Changes the Cost Curve but Connected Data Changes Value Creation","type":"Strategy Talk","track":"Structural Engineering & Fabrication","industry":"Engineering service providers","products":"None","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Executive & Decision Maker","speakers":"Knut Ramstad; Marius Jablonskis","abstract":"AI is often discussed in terms of efficiency, but the bigger shift may be how connected data improves the quality, consistency, and usefulness of expert delivery. This session will share Norconsult’s perspective on how AI and connected data are beginning to influence decision support, delivery workflows, and client value across architecture, engineering, construction, and operations (AECO). We’ll explore why the impact goes beyond isolated productivity gains, where connected data makes AI more relevant in practice, and what leaders should consider as technology starts to affect how value is created in engineering and project delivery. The session will focus on practical implications and lessons emerging from real industry needs.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105129651001P9u0"},{"code":"AU4258-D","title":"AI-Connected Workflows: Fusion, Claude, and MCP 101","type":"Technical Deep Dive","track":"Product Development","industry":"","products":"","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Small Business","speakers":"Luke Mihelcic","abstract":"\u003cp>Discover how Autodesk Fusion, Claude, and MCP (Model Context Protocol) can work together to create smarter, more connected engineering workflows. This introductory session will explore how conversational AI can assist with design, automation, scripting, documentation, and workflow generation inside Fusion environments, while MCP enables secure connections between AI, tools, and data sources. Attendees will learn foundational concepts, practical integration examples, and real-world use cases that demonstrate how AI-driven workflows can improve productivity, collaboration, and decision-making across product development and manufacturing.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105148140001Pi4i"},{"code":"CES3138-D","title":"AI Data Check for Civil 3D: Validating Models Against Project Requirements via APS","type":"Technical Deep Dive","track":"Civil Engineering","industry":"Civil infrastructure","products":"Civil 3D; Docs","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Mohamad KASSIR","abstract":"This session will present a platform built through vibe coding using Autodesk Platform Services APIs, Autodesk Forma (formerly Autodesk Construction Cloud), and AI code generation to automate the full data validation cycle for Civil 3D models. The platform pulls files from Forma, extracts metadata via the Model Derivative API, and ingests project requirement PDFs. An AI layer converts PDFs into structured validation rules, then runs them against the model to produce a detailed conformity report, flagging gaps, mismatches, and missing attributes without manual checks. The session will also cover key lessons from development, AI-driven architecture, and real-world use cases showing practical impact at scale.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105129097001PVyz"},{"code":"LS2969-D","title":"AI Data Ready: From Design to Construction to Operations","type":"Technical Deep Dive","track":"Construction Management","industry":"Life sciences manufacturing","products":"Assemble Products; BIM 360 Build; Revit Cloud Worksharing","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Growing Team Leader","speakers":"Gilbert Kwan; Stacy Goins; Victor Strausbaugh","abstract":"Design and construction projects involve diverse tools and stakeholders across phases, creating fragmented, inconsistent data and documentation. This session will show how we establish an AI-ready data foundation from day one using the Autodesk Forma Assets module, enabling a continuous digital thread from design through construction to operations. We’ll demonstrate how standardized data from Revit models and equipment lists—aligned with CSI MasterFormat and UniFormat—connects design, procurement, project controls, commissioning, and operations. By treating models and metadata as lifecycle deliverables, we reuse and enrich data instead of recreating it—with Forma serving as the central platform for integrated, reliable, AI-ready project data.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105124646001P35H"},{"code":"BES2251-D","title":"AI for Ideation: Telling a good story with Generative AI and Autodesk Platform Services (APS)","type":"Technical Deep Dive","track":"Architecture","industry":"Engineering service providers","products":"Autodesk Platform Services; Forge","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Andrell Laniewicz; Zachary Smith","abstract":"Imagine this scenario: You’re a developer and a user identifies a problem that, when solved, could save hundreds of hours per project. Moreover, there doesn’t appear to be a solution on the market that solves this problem adequately, so you get to build something. In an industry where users are more likely to buy a story than a product, how do we tell a good story? This discussion will center around our approach to collaboratively translating ideas into prototypes. We’ll use generative AI and Autodesk Platform Services as our low-barrier-to-entry tools for the code, and demonstrate the value of building trust in the solution by building it together.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105112530001P9jD"},{"code":"BES1245-D","title":"A.I. Without Chaos: AutoCAD and Revit Plugin Development with Spec-Driven Development","type":"Technical Deep Dive","track":"Software Development","industry":"Engineering service providers","products":"AutoCAD; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Small Business","speakers":"Fernando Malard","abstract":"AI coding tools are changing how software is developed in architecture, engineering, construction, and operations (AECO). Inconsistent outputs, lack of standards, and tight coupling to platform APIs often lead to fragile and unstable plug-ins. This class will introduce Spec-Driven Development (SDD) as a practical, tool-agnostic approach to bring structure and reliability to AI-assisted development. Instead of prompts and chat history, SDD uses persistent specifications as the source of truth. Using plug-ins in AutoCAD and Revit software, we’ll demonstrate how to separate business logic from platform-specific implementations. You’ll learn how SDD can use modern AI tools such as OpenAI Codex to transform AI from a source of chaos into a controlled software development asset.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105090003001PdBx"},{"code":"CS3291-D","title":"An agentic future-state of embedded certainty through Forma, Informed Design and KOPE.’","type":"Strategy Talk","track":"Industrialized Construction","industry":"Construction services","products":"Informed Design; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Executive & Decision Maker","speakers":"David Flynn","abstract":"\u003cp>Discover the future of productization in Autodesk Forma. Learn how connecting Forma to KOPE and Informed Design begins to deliver on the convergence of construction and manufacturing. This session will show you how to use AI agents to translate generic design intent in Forma into constructible building systems, like detailed partition wall assemblies in KOPE, while adding full manufacturing components from connections to fasteners in Informed Design. By instantly transitioning to high-fidelity models, you use fluid workflows in Forma with instant, quantifiable insights that drive certainty around design risk and cost drivers in preconstruction.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105130764001PobL"},{"code":"BES3590-D","title":"APS GraphQL in Production: AEC & MFG Patterns from Analytics to AI Agents","type":"Technical Deep Dive","track":"Autodesk Platform Services (APS)","industry":"Engineering service providers","products":"Docs; Forma; Fusion","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Growing Team Leader","speakers":"Kevin Vandecar","abstract":"Autodesk's Data Model APIs for architecture, engineering, and construction (AEC) and manufacturing (MFG) use GraphQL—unlocking richer integrations and AI-powered workflows. But GraphQL differs from REST in ways that quietly break production systems. Our team has shipped analytics dashboards, workflow automation, and Model Context Protocol (MCP) servers, letting AI agents query live design data. We've hit the pitfalls so you don't have to. This session will deliver production-proven patterns: query design for AEC/MFG data models, partial-success error handling, enterprise authentication, mutation patterns, and AI-agent enablement via MCP. We’ll also highlight the underused GraphQL capabilities in the User Profile API. Real examples. Real lessons. Patterns that work from day one.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105135683001P6gX"},{"code":"TR1675-D","title":"Autodesk VRED: Latest Real-Time Visualization Trends combined with AI Transforming Automotive Design","type":"Technical Deep Dive","track":"XR","industry":"Automotive and other transportation","products":"Alias AutoStudio; Arnold; Fusion; VRED; VRED Professional","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Victor Perez; Pascal Seifert","abstract":"\u003cp>Autodesk VRED is known for rapidly adopting state of the art rendering technologies, open standards, and AI workflow tools. This Autodesk University session explores new key capabilities including Vulkan Ray Tracing, Gaussian Splat rendering, CloudXR streaming to Apple Vision Pro, and the use of constraints and physics. Learn how these technologies work together to deliver highly realistic visuals and physically plausible behavior for complex digital twins with minimal setup time. Discover how designers, engineers, and visual artists can accelerate projects, improve collaboration, and reduce costly errors early in the digital model. Ideal for visualization, XR, and automotive workflows focused on performance, realism, and scalability.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105099137001PeBS"},{"code":"CES3922-D","title":"Better Together: Drainage Design Best Practices with InfoDrainage and Civil 3D","type":"Technical Deep Dive","track":"Civil Engineering","industry":"Civil infrastructure","products":"Civil 3D; InfoDrainage","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Hunter Sparks","abstract":"With the release of drainage tools for Civil 3D 2026, users are asking: How do these tools fit into Autodesk’s drainage design ecosystem? This session provides a clear, practical comparison of drainage tools for Civil 3D and InfoDrainage, including how each solution integrates into your workflows. This session will demonstrate how to combine Autodesk tools with open-source solutions and LLM’s to unlock new possibilities. We streamline the drainage design process by using API and Civil 3D tools for catchment delineation. Walk away with a practical understanding of the tools, with the ability to navigate Autodesk’s evolving drainage design landscape and leverage a hybrid ecosystem for scalable, intelligent design.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105141351001PiIJ"},{"code":"CP1340-D","title":"Beyond Automation: AI Collaboration with Autodesk Assistant","type":"Technical Deep Dive","track":"Community & Expert Elites","industry":"Consumer products","products":"Fusion","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Educator & Workforce Builder; Small Business","speakers":"Alex Lobos","abstract":"This session will demonstrate how the recently introduced Autodesk Fusion AI Assistant enhances product development. AI Assistant accelerates early-stage design exploration, development, and fabrication by translating text into CAD, automating workflows, and accelerating implementation. Case studies of consumer products will illustrate how AI Assistant improves efficiency, when traditional methods are more effective, and how to best combine both. The session will cover prompt engineering techniques that improve output quality. By adopting these workflows, teams can reduce repetitive tasks, improve iteration speed, and focus human expertise on higher-value design decisions, ultimately achieving faster, more informed results.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105091155001P4cL"},{"code":"AS1652-D","title":"Beyond Dynamo: Using AI to build APS automations that publish 100+ Revit models in 10 minutes","type":"Technical Deep Dive","track":"Autodesk Platform Services (APS)","industry":"Architecture services","products":"Forma Design Collaboration; Autodesk Platform Services; BIM Collaborate Pro; Docs; Dynamo","duration":"","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Olga Kerkhanidi","abstract":"Every BIM specialist who automates with Dynamo hits the same wall: The task that most needs automation lives outside of Revit. Publishing more than 100 models without links in Autodesk Forma (formerly Autodesk Construction Cloud) has no batch option—just hours of clicking. Autodesk Platform Services is the answer, but the jump to REST APIs stops most non-developers. This session will bridge that gap with AI pair programming. We'll walk through two Autodesk Platform Services automations from a live project: One parses the Autodesk Forma project tree mapping every Revit file to its URN. Another batch-publishes without links—117 models, eight minutes. Real code, real errors. We'll cover prompting a large language model (LLM) for working Autodesk Platform Services calls, where Python knowledge helps, and making scripts reusable across projects. This session is for anyone who's outgrown Dynamo and wants a path into Autodesk Platform Services.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105097991001PG08"},{"code":"CP2848-D","title":"Beyond the BOM: Using PLM to Drive Modern Product Management","type":"Strategy Talk","track":"Product Development","industry":"Consumer products","products":"Fusion; Fusion Manage","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Gus Quade","abstract":"Product lifecycle management (PLM) is often treated as a system of record for BOMs—but leading teams are using it to drive product strategy, execution, and cross-functional alignment. In this session, we’ll show how to evolve PLM into a product management backbone that connects engineering, operations, and business decisions. You’ll learn practical workflows for managing product definitions, changes, and lifecycle data in a way that improves visibility, reduces delays, and enables better decision making. Walk away with patterns you can apply immediately to move beyond BOM management and unlock real business value from PLM.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105123551001PNXI"},{"code":"BES1631-D","title":"Boosting Autodesk Development Using AI with AutoLISP and C# .NET","type":"Strategy Talk","track":"AutoCAD & General Design","industry":"Engineering service providers","products":"AutoCAD; AutoCAD Architecture; AutoCAD Electrical; AutoCAD Mechanical","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Todd Schmoock; James Johnson","abstract":"Learn how to use AI as a practical coding assistant to accelerate AutoCAD development. This 30-minute strategy session will show how AI can generate AutoLISP routines and C# .NET code, assist with debugging, and support code translation—enabling faster iteration and higher-quality results. Attendees will gain strategies to evaluate AI-generated code, integrate it into existing projects, and apply AI-assisted workflows effectively across both legacy and modern Autodesk development.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105096869001PcRP"},{"code":"BLD3760-D","title":"Break the Desktop Barrier: Dynamo in the Cloud for Scalable Revit and Civil3D Automation","type":"Technical Deep Dive","track":"Architecture","industry":"Buildings","products":"Civil 3D; Dynamo; Forma; Forma Data Management Essentials; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Small Business","speakers":"JT Pierson; Achintya Bhat","abstract":"Ever ran the same Dynamo graph across multiple projects and waited hours while Revit or Civil 3D software was locked? What if you could hand it off instead? This session will dive into how Dynamo Switchboard enables cloud execution of Dynamo graphs across projects at scale. Rather than running workflows locally or building custom pipelines with Design Automation, you can now execute graphs through a simple, player-like interface. Learn how to run batch automations across multiple models without opening host applications, and review results through logs and the Dynamo graph web viewer. Through live demos, you’ll see how to launch runs and interpret results. We’ll also briefly explore connecting workflows with Autodesk Platform Services and AEC Data Models.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105138474001PbES"},{"code":"BES3601-D","title":"Bridging BIM and Hydraulics: Civil 3D and InfoWorks WS Pro for Smart Pressure Networks","type":"Technical Deep Dive","track":"Civil Engineering","industry":"Engineering service providers","products":"Civil 3D; InfoWorks WS Pro","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Nathan Gerdts","abstract":"Discover a new integration between Civil 3D and InfoWorks WS Pro software that connects BIM-based pressure pipe network design with detailed hydraulic analysis. See how bidirectional data exchange helps teams create constructable 3D networks using real parts while validating pressure, flow, and performance in InfoWorks WS Pro. Learn how this workflow improves design quality, reduces rework, and supports more-cost-effective outcomes. An industry expert will share real-world workflows, key benefits, lessons learned, and practical recommendations for successful adoption.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105136232001Pk7y"},{"code":"CS4180-D","title":"Builders in the AI Loop: How We Accelerate Construction and Preserve Judgement","type":"Strategy Talk","track":"Construction Management","industry":"Construction services","products":"Forma","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Growing Team Leader","speakers":"Richard Antczak","abstract":"AI is increasing output across construction teams, but many leaders are seeing a quieter problem: more-polished work, less ownership. With more options come harder decisions. This strategy talk will use one concrete story and a practical framework to show how to adopt AI without eroding the judgment that experienced builders, designers, and owners have earned the hard way. You’ll learn how to separate AI-assisted production from the human decision making that takes decades to develop. We’ll discuss how leaders in the industry add thinking checkpoints within workflows that make teams faster while preserving their precious (and playful) cognition.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105146895001PvZR"},{"code":"BLD1870-D","title":"Building an AI-Ready BIM Data Backbone with Autodesk APS","type":"Technical Deep Dive","track":"Autodesk Platform Services (APS)","industry":"Buildings","products":"Autodesk Platform Services; Revit","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Valeriia Vlasenko; Moritz Mombour","abstract":"Most architecture, engineering, and construction (AEC) organizations struggle to scale automation and AI because BIM data is fragmented, inconsistently governed, and tied to individual projects. This session will show how Drees & Sommer and AnkerDB built a centralized BIM data backbone using Autodesk Platform Services and Autodesk Forma (formerly Autodesk Construction Cloud) to enable reliable automation and consistent data quality at scale. The collaboration started as a rapid proof of concept at DevCon 2025, was validated across multiple projects, and is now scaling at the business-unit level. The session will explain how Autodesk Forma data, Autodesk Platform Services software, and downstream systems were connected to support automated validation, data enrichment, analytics, integrations, and AI-supported workflows for cost management and lifecycle assessment (LCA).","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105102462001P3NB"},{"code":"BES1377-D","title":"Building Custom AEC Apps in Minutes: AI-Assisted Development with FORMA and VIKTOR.AI","type":"Technical Deep Dive","track":"Structural Engineering & Fabrication","industry":"Engineering service providers","products":"Autodesk Platform Services; Forma; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Peter Madlener; Jordana Rosa","abstract":"\u003cp>Design teams increasingly need trusted workflows that connect Autodesk Forma, Autodesk Platform Services (APS), agentic AI, engineering tools, proprietary company knowledge, and cloud automation to solve real project challenges. This session explores how organizations can use open APIs and modern development platforms to build custom applications and intelligent workflows around Forma Site Design and Building Design.\u003c/p> \u003cp>Attendees will learn how to integrate project data, automate engineering and design processes, connect cloud services, and extend Autodesk workflows with company-specific logic. We will also introduce the Autodesk Marketplace and discuss how developers can package and distribute solutions that strengthen the Autodesk ecosystem.\u003c/p> \u003cp>\u003cbr/> Using VIKTOR.AI as the application, workflow, and agentic automation layer, we will demonstrate how Autodesk technologies can be combined with AI, engineering software, and internal knowledge. We will show how organizations can move beyond isolated AI prompts by creating transparent, controlled, and verifiable workflows in which agents execute tasks, use engineering tools, and present traceable results for expert review.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105091704001P45J"},{"code":"AS1619-D","title":"Building Resilient Communities: A Collaborative Revit 2027 Sample Model","type":"Strategy Talk","track":"Community & Expert Elites","industry":"Architecture services","products":"Forma Design Collaboration; BIM Collaborate Pro; Docs; Revit; Revit Cloud Worksharing","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Paul Aubin","abstract":"Following the 2025 Los Angeles fires, The Foothill Catalog Foundation and Autodesk partnered to accelerate rebuilding through a collection of preapproved residential designs. This session will go behind the scenes of creating the new Revit 2027 residential sample model that is part of this catalog. We’ll explore the unique collaboration between a nonprofit and Autodesk to develop the design with interchangeable options. Discover the challenges of balancing municipal standards with modeling best practices, and see the \"split\" where the model evolved into both a product asset and a real-world home. Join representatives from The Foothill Catalog Foundation and Autodesk to learn how Revit can transform residential workflows and empower communities. Build better, together.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105095734001PYxm"},{"code":"MFG1025-D","title":"Building the Digital Thread: Connecting CRM, Vault PLM, MES, and ERP from Order to Delivery","type":"Technical Deep Dive","track":"Product Development","industry":"Manufacturing Other","products":"Autodesk Platform Services; Fusion Manage; Fusion Operations; Inventor; Vault Professional","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Christian Gessner; Markus Gundersen","abstract":"Manufacturing organizations often struggle with disconnected systems across sales, engineering, and production. This class will show how Vault PLM software forms the backbone of a connected digital thread spanning customer relationship management (CRM), CAD, product data management (PDM), product lifecycle management (PLM), manufacturing execution systems (MES), and enterprise resource planning (ERP). Starting from a CRM order, we’ll demonstrate rule-based CAD automation, engineering data management in Vault, and seamless Item and BOM synchronization into Autodesk Fusion Manage—driven by the built-in connector. Design reviews are handled through a web interface powered by the Vault Data API, manufacturing execution runs in Autodesk Fusion Operations, and business data flows into ERP—event-driven and AI-assisted. See how Vault PLM bridges engineering and enterprise to streamline the journey, from order to delivery.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105084110001PZCc"},{"code":"MFG3103-D","title":"Building the Digital Thread: M2X’s Path from Engineering to Manufacturing Scale","type":"Strategy Talk","track":"Design & Engineering","industry":"Manufacturing Other","products":"AutoCAD Plant 3D; Fusion Manage; Inventor; Vault PLM","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Executive & Decision Maker; Growing Team Leader","speakers":"Justin Johnson; Nicholas Schwartz","abstract":"What breaks when a 10-person engineering team becomes a 70-person manufacturing organization? This session will explore M2X’s real-world journey scaling with Inventor, Vault, AutoCAD Plant 3D, and Autodesk Fusion Manage software. Learn how the team transitioned from ad hoc design workflows to structured data management and a connected PDM/PLM strategy. We’ll cover how to time tool adoption, avoid common scaling missteps, and enable cross-functional collaboration between engineering and production. You’ll gain practical frameworks to structure product data, build a digital thread, and support rapid growth—while improving quality, reducing rework, and maintaining control across the product lifecycle.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105128550001P7Fi"},{"code":"CS3571-D","title":"Connected Carbon Data for Construction: API-Powered Decisions at Scale","type":"Strategy Talk","track":"Preconstruction","industry":"Construction services","products":"Forma; Quantity Takeoff; Revit","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Marta Bouchard","abstract":"Construction teams face growing pressure to make early, data-driven carbon decisions. Yet fragmented regional data sets limit consistency and scalability across tools. This session will explore how TBI, a leading construction firm, is advancing end-to-end carbon assessment by connecting data across planning, design, and preconstruction workflows. Using Autodesk Forma Carbon Insights (Autodesk Forma, Revit, and Forma Takeoff) and the Sustainability Data API, TBI will demonstrate how API-powered strategies enable early-stage carbon comparisons across multiple regions, reduce manual data handling, and scale assessments across projects. You’ll gain a strategic framework for driving better, data-informed decisions through connected, scalable carbon workflows.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105135135001PmBG"},{"code":"BLD1669-D","title":"Connecting AECO Workflows End-to-End with the Autodesk Forma Industry Cloud","type":"Technical Deep Dive","track":"Architecture","industry":"Buildings","products":"Build; Docs; Forma; Model Coordination; Quantity Takeoff","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Joey Matla; Alejandra Beaujon","abstract":"See how architecture, engineering, construction, and operations (AECO) teams connect planning, design, coordination, and construction workflows in a single AI and data-driven environment using the Autodesk Forma industry cloud. This technical and practical deep dive will walk through real workflows—from site planning in Autodesk Forma to design in Revit software, coordination in Forma Design Collaboration, and execution in Forma Build. Learn how data flows through Autodesk Data Management as a common data environment, preserving decisions across phases with practical examples. Explore practical AI-powered use cases such as rapid design iteration, automated analysis, and model-based coordination. And discover how to reduce manual work, improve collaboration, and implement connected workflows across the AECO lifecycle.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105098563001Psa2"},{"code":"BES3063-D","title":"Connecting BIM to Citizen-Scale Digital Twins: Sustainability, Compliance & Connected Infrastructure","type":"Strategy Talk","track":"Civil Engineering","industry":"Engineering service providers","products":"Build; Civil 3D; Revit; Workshop XR","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Francesco Cappilli","abstract":"SIMICO S.p.A delivered infrastructure to the 2026 Winter Olympics (Livigno, Cortina, Milano, Verona, Bormio) using a full Autodesk pipeline: Autodesk Forma (formerly Autodesk Construction Cloud), Autodesk Forma Build, Autodesk Platform Services, Revit, Civil 3D, AutoCAD, and Navisworks software. Autodesk Forma and Autodesk Build managed cost, schedule, and field workflows. Autodesk Platform Services connected everything bidirectionally. This Autodesk-Azure dual common data environment (CDE) enabled a complex environment where BIM authoring changes synced with Forma cost tracking, Build field logs, and compliance docs. These pipelines preserved data integrity from Autodesk tools to digital XR experiences (VR/AR/pixel streaming), making the twin accessible to all stakeholders. Tailored as such, this system delivered an organic ecosystem, reducing risk and accelerating decisions on complex public infrastructure in Italy.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105127437001PBsZ"},{"code":"BES3331-D","title":"Continuous vs. Periodic Clash Detection : Can Model Coordination and Autodesk AI replace Navisworks?","type":"Technical Deep Dive","track":"Preconstruction","industry":"Engineering service providers","products":"Cloud Worksharing; Forma; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Growing Team Leader","speakers":"Anas Poshekar","abstract":"Is the Navisworks silo holding your project back? For 20 years, coordination was a \"once a week\" event locked on a desktop. No more. This session will explore the leap to continuous, cloud-native coordination in Autodesk Forma (formerly Autodesk Construction Cloud). We’ll dive into how Model Coordination democratizes BIM, using Autodesk AI and Autodesk Assistant to validate clashes against specs in real time. Learn to ditch static PDF reports for a closed-loop workflow that connects designers directly to fixes. We’ll settle the debate: Where does Model Coordination win, and when do you still need the Navisworks \"power user\" kit? Join us to build a road map for a faster, AI-augmented and integrated future. Stop clashing. Start coordinating.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105131309001Pwxx"},{"code":"CES2118-D","title":"Data-Driven Water Utilities: BIM-GIS Validation and Digital Twins at Gruppo CAP","type":"Technical Deep Dive","track":"Infrastructure Owners","industry":"Civil infrastructure","products":"Civil 3D; Forma; InfoWorks ICM; ReCap; Revit","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Growing Team Leader","speakers":"Antonio Devito; Giuseppe Barberio","abstract":"Inconsistent data across the water lifecycle hinders operational resilience. This session will present the technical framework developed for Gruppo CAP (Milan) to bridge this gap using Autodesk Forma as a unified cloud environment. Starting from scan-to-BIM modeling of a water plant, we’ll detail a custom validation engine built on Autodesk Platform Services that automates model checking against asset information requirem`ents (AIR) standards via specialized scripts. We’ll explore how validated BIM data flows into Esri Utility Network to fuel InfoWorks ICM solutions for advanced hydraulic modeling. You’ll evaluate how this scalable architecture, in a large-scale utility, uses Power BI to transform data into a simulation-ready digital twin for smarter asset management.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105107422001PJjY"},{"code":"CES1592-D","title":"Design Fast, Validate Smart: Extending InfoDrainage with Parametric Workflows in Civil 3D and InfoWorks ICM to Deliver Multiple Benefits","type":"Strategy Talk","track":"Civil Engineering","industry":"Civil infrastructure","products":"Civil 3D; InfoDrainage; InfoWorks ICM","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Juan Aguirrebengoa; Pablo Souto","abstract":"Early-stage drainage design prioritizes speed, using simplified assumptions to test options quickly. However, challenges such as combined sewer overflows (CSOs), flooding, biodiversity loss, and wider community outcomes are increasingly interconnected and require a more systems-based approach that extends beyond the traditional boundaries of the water sector. This session explores how connected digital workflows can support the identification, design, and validation of sustainable drainage interventions that deliver multiple benefits. Using an anonymized case study, attendees will see how opportunities can be rapidly explored through parametric site-design workflows in Civil 3D and InfoDrainage, then assessed through system-scale modelling in InfoWorks ICM to understand impacts on flood risk and CSO frequency, volume, and timing. The session focuses on balancing speed, rigour, and confidence in decision-making, helping practitioners understand how technology, systems thinking, and proportionate modelling can support more resilient and integrated outcomes for communities and the environment.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105094617001PMyb"},{"code":"CS3563-D","title":"Digital Project Delivery, Forma Build Implementation","type":"Technical Deep Dive","track":"Construction Management","industry":"Construction services","products":"Build; Forma; Model Coordination; Revit","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Growing Team Leader","speakers":"Rania Hassan","abstract":"Our session will show how Autodesk Forma was implemented and governed on a live health care project, adapting workflows to project‑specific needs. We will demonstrate the application of standards during active delivery to maintain consistency and data integrity while teams adopt the platform and evolve digital practices in real time. You’ll learn how collaboration was structured across Autodesk, construction technology, operations, and BIM by deploying two Autodesk Forma Build projects to separate design coordination from construction execution, alongside targeted training. We’ll also cover license provisioning, role‑based access, content ownership alignment, and Power BI dashboards that deliver actionable insights for better decisions.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105134584001PuPN"},{"code":"FAB1996-D","title":"Don’t AI everything: Hybrid automation with APS and Revit.","type":"Technical Deep Dive","track":"Autodesk Platform Services (APS)","industry":"Building products and fabrication","products":"Autodesk Platform Services; Revit","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Neil Lee; Petr Broz; Will North","abstract":"Automation specialists are increasingly tasked with finding areas to implement AI. But how do we decide when AI is the correct tool and when deterministic automation serves better? Through a live demo of an AI-augmented building regulation compliance checker running on Autodesk Platform Services, we will explore a practical hybrid framework. The Automation API and Revit software handle rule evaluation through a deterministic engine. Large language models (LLMs) extract compliance rules from regulation documentation and explain failures in natural language. And the Viewer SDK provides visual context. We’ll demonstrate a human-in-the-loop approach and show how AI architecture adapts rapidly when regulations change or new markets require new rule sets.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105105237001PcWl"},{"code":"AU4178-D","title":"Do You Trust Me? Building Trustworthy AI for Design and Engineering Workflows","type":"Strategy Talk","track":"Future Industry Innovations","industry":"Other","products":"None","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Executive & Decision Maker","speakers":"Ousama Lakhdar-Ghazal","abstract":"As AI becomes embedded in design and engineering tools, the question isn’t just what it can do—it’s whether you can trust it. This session will cover practical ways to make AI more reliable, including handling proprietary versus common design data—and validating outputs. You'll learn practical tactics for increasing the trustworthiness of AI models, with a focus on real-world challenges like distinguishing proprietary intellectual property from common design elements and validating the accuracy of AI-generated outputs. We’ll explore assessing inputs, adding safeguards, and creating feedback loops to improve performance over time—so you can adopt and build AI responsibly without sacrificing quality or compliance.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105146340001PP0K"},{"code":"MFG2507-D","title":"Driving Business Impact with PLM: A Customer Panel Discussion","type":"Strategy Talk - Panel","track":"PLM","industry":"Manufacturing Other","products":"Fusion; Fusion Manage; Vault PLM; Vault Professional","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Executive & Decision Maker; Growing Team Leader","speakers":"Michael Vesperman","abstract":"Hear directly from leading organizations across industries as they share how PLM is helping them transform the way they work. In this dynamic panel, customers will discuss how they connect data, streamline processes, and improve collaboration to tackle real business challenges. From accelerating time to market to improving product quality and reducing costs, you’ll gain practical insights into what’s working, what they’ve learned, and how they’re achieving measurable results. Whether you're early in your connected data and processes journey or you’re looking to scale, this session will offer actionable takeaways. This session is part of the PLM Summit—a curated learning and networking experience. To explore related sessions, select “PLM Summit” track.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105115317001PKkc"},{"code":"CES1635-D","title":"Dr. Vibe: How I Learned to Stop Worrying and Start Loving Autodesk Platform Services","type":"Technical Deep Dive","track":"Autodesk Platform Services (APS)","industry":"Civil infrastructure","products":"AutoCAD; Autodesk Platform Services; Forma","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Winston Pagliaro","abstract":"This is a tale from a BIM manager’s foray into vibe coding—going from having no coding experience to building web applications that tap into the Autodesk Platform Services APIs to supercharge the capabilities of our Autodesk Forma-based CAD managers. Have you been curious about Autodesk Platform Services but haven’t pulled the trigger because you’re not “a developer”? With Dr. Claude’s help, you can be! Come to this session to learn tips on diving into the world of Autodesk Platform Services and large language models (LLMs). We’ll share lessons learned on working hand in hand with these LLMs in a safe and efficient way so that you can also share in this digital boon.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105097424001PORi"},{"code":"BLD2703-D","title":"Eaton and Trane: 1-GW Data Center Codesign with BIM and Autodesk Forma","type":"Strategy Talk","track":"MEP Engineering & Fabrication","industry":"Buildings","products":"Docs; Forma","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Growing Team Leader","speakers":"Justin Carron; Kieran Mak; Victor Mirasola","abstract":"This class will showcase how Trane, Eaton, and Autodesk enable collaborative codesign for gigawatt-scale data centers using BIM and Autodesk Forma (formerly Autodesk Construction Cloud). You will see how data center reference kits become live, cloud-based environments for real-time collaboration between owners, engineers, and contractors. These environments centralize BIM and engineering data into a shared source of truth, enabling coordinated design of mechanical and electrical systems at massive scale. The session will demonstrate how Autodesk Forma Build supports structured codesign workflows, role-based collaboration, and asset-centered data models. This approach enables faster iteration, reduced risk, and scalable delivery for data centers of 1 gigawatt capacity.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105120275001PHMl"},{"code":"EDU1915-D","title":"EDU1455 Unlock the power of AI for AutoCAD 2027 Toolsets","type":"Technical Deep Dive","track":"AutoCAD & General Design","industry":"Education","products":"AutoCAD; AutoCAD Mechanical; AutoCAD Plant 3D; Fusion; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist; Small Business","speakers":"Lina El-Khoury; Hung Nguyen","abstract":"Unlock the full potential of AI in AutoCAD 2027 toolsets. Building on our AU 2024 award-winning class, this session will explore how AI-powered tools revolutionize CAD, driving unmatched efficiency. Experience how AutoCAD 2027 software’s AI automates complex workflows—from intelligent object recognition and predictive drafting to real-time generative design. With automated dimensioning, predictive error-correction, and material optimization, you’ll slash design cycles. Use AI-driven simulation to stress-test designs against real-world scenarios, ensuring peak performance. Transform your workflow with seamless, AI-enhanced interoperability that bridges multidisciplinary teams. Future-proof your craft with smarter, faster, and more creative CAD.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105103564001PRP6"},{"code":"BES3454-D","title":"End-to-End Drainage Design with Forma, InfoDrainage and Civil 3D","type":"Technical Deep Dive","track":"Civil Engineering","industry":"Engineering service providers","products":"Civil 3D; Forma; InfoDrainage","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Javier Soto","abstract":"\u003cp>InfoDrainage and Autodesk Forma will soon work together as part of a connected workflow for site drainage design. In this session, you'll work with Civil 3D and InfoDrainage models hosted in Forma, using live references such as surfaces and CAD background data to keep design information connected across applications. \u003c/p> \u003cp> Starting from a site design, you'll develop and optimize a drainage network in InfoDrainage, leveraging connected site data to accelerate hydrologic design. \u003c/p> \u003cp> The workflow continues with dynamic hydraulic simulation, exceedance assessment, and review of results, followed by compliance-ready reporting. The session concludes by synchronizing the completed drainage design back to Civil 3D, demonstrating a streamlined, connected workflow from site model to validated drainage design.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105132956001POm3"},{"code":"CES2572-D","title":"End-to-End New Geolocation Solution Across Autodesk Platforms: From Civil 3D to Revit","type":"Strategy Talk","track":"Civil Engineering","industry":"Civil infrastructure","products":"AutoCAD; Civil 3D; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Small Business","speakers":"Frank Huang","abstract":"Geolocation is essential for accurate positioning, data integration, and interoperability across architecture, engineering, and construction (AEC) workflows. This session will introduce core concepts such as coordinate systems, datums, and spatial references—and show how they’re applied across Autodesk platforms. You will learn how to create and manage coordinate systems in Civil 3D software, define geolocation in Civil 3D and AutoCAD software, and understand how these support geographic information system (GIS) integration. The session will also cover legacy and modern geolocation workflows in Revit software, highlighting improvements in model alignment and interoperability. By connecting workflows across Civil 3D and Revit, this class will provide practical guidance on maintaining consistent geospatial positioning throughout a project’s lifecycle.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105116959001PJI2"},{"code":"MFG1493-D","title":"Engineering Copilot: Real AI Workflows for Vault, BOMs, and Manufacturing Data","type":"Technical Deep Dive","track":"Autodesk Platform Services (APS)","industry":"Manufacturing Other","products":"Vault PLM; Vault Professional","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Christian Gessner; Tyler Warner","abstract":"AI is everywhere—but how does it actually help engineering teams working with CAD, BOMs, and Vault software? This class will demonstrate real-world applications of AI on top of Vault, focusing on engineering and manufacturing processes. Using live examples, we’ll show how structured data such as eBOMs and mBOMs can be interpreted, transformed, and enriched using AI while keeping engineers in control. You’ll see how natural-language interfaces, rule-based automation, and AI-assisted decision making support tasks like BOM transformation, process planning, and validation. The session will highlight proven architectures, integration patterns, and limitations when introducing AI into Vault-based environments.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105092396001P6Dg"},{"code":"AS2841-D","title":"Forma to Energy: AI-Powered Workflows for Carbon Insight","type":"Technical Deep Dive","track":"MEP Engineering & Fabrication","industry":"Architecture services","products":"Forma; Insight; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Daniel Stine; Tetsuya Hishida; Chris Balbach","abstract":"Energy and carbon analysis often arrives too late—after key decisions have been made. Despite tools like Autodesk Forma, Revit, and Insight software, most teams rely on manual, disconnected workflows that limit iteration. This session will introduce a connected, data-driven approach. By embedding performance data in BIM and using AI to generate simulation logic, teams can automatically produce carbon and energy analyses—earlier, more frequently, and without deep simulation expertise. Through a live demo, you’ll see design data flow from Autodesk Forma through Revit into automated workflows and into Insight for actionable results. Attend this class to learn how to replace one-off analysis with scalable, repeatable carbon workflows.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105123006001PT79"},{"code":"AU2467-D","title":"From 2D to Digital Twin: Connecting Design to Oper","type":"Strategy Talk","track":"Capital Project Owners & Operators","industry":"Other","products":"Desktop Connector","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Executive & Decision Maker; Growing Team Leader","speakers":"Enrico Trovato","abstract":"Retail construction still relies heavily on fragmented 2D documentation, creating a disconnect between design, construction, and operations. This session will explore how EssilorLuxottica is transforming that model by converting 2D assets into structured 3D BIM and building a connected digital lifecycle. By linking design data to Internet of Things (IoT) sensors and maintenance workflows, stores evolve from static deliverables into dynamic, data-driven digital twins. This session will present a scalable approach to connect design to operations, improve asset visibility, and enable predictive maintenance, turning retail environments into fully integrated intelligent assets.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105114208001PZg7"},{"code":"MFG3883-D","title":"From AutoCAD Toolsets to Inventor: Enabling Connected Workflows with Desktop Connector and Forma","type":"Technical Deep Dive","track":"AutoCAD & General Design","industry":"Manufacturing Other","products":"AutoCAD; AutoCAD Electrical; AutoCAD Mechanical; Forma Data Management Essentials; Inventor","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist; Growing Team Leader; Small Business","speakers":"Chaitanya Belsare; Sagar G S","abstract":"This session will demonstrate how to connect AutoCAD Electrical electromechanical workflows, AutoCAD Mechanical linked with Inventor software, and factory design workflows for seamless data exchange. Learn how to integrate layouts and models across tools, enabling accurate coordination from schematics to 3D design. Discover how cloud-based solutions like Desktop Connector and Autodesk Forma improve collaboration, maintain data continuity, and reduce rework. Through practical examples, see how connected workflows enhance efficiency and accelerate project delivery.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105140678001PKpp"},{"code":"CES3061-D","title":"From Borehole to Building: Advanced Ground Modeling Directly in Civil 3D with GeoDin Ground","type":"Strategy Talk","track":"Civil Engineering","industry":"Civil infrastructure","products":"Civil 3D","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Executive & Decision Maker","speakers":"Devrez Karabacak","abstract":"Ground models are the missing link between site investigation and infrastructure design. Engineers make critical decisions on alignments, crossings, and foundations while the subsurface remains a black box—data arriving late, locked in static reports, or in formats incompatible with the design environment. GeoDin Ground for Civil 3D software is changing that. In this session, we’ll present the latest advances in 3D ground modeling inside Civil 3D, including direct AGS file ingestion and autoconversion—eliminating the need for a preexisting database and letting teams start directly with received data. You’ll see the ground take shape inside Civil 3D, evolving into a 3D model that drives critical design choices and reduces project risk from day one.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105126884001Pzfq"},{"code":"FTV1750-D","title":"From Capture to AI: How Data Enrichment Unlocks the Value of Motion","type":"Strategy Talk","track":"Future Industry Innovations","industry":"Film and TV","products":"Flow Production Tracking; Maya","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Olivier Zurcher","abstract":"\u003cp>AI-powered animation is only as good as the data behind it, but most motion data wasn’t designed for AI. In this session, we’ll demonstrate a projection-mapped capture app that guides performers in real time to produce more-structured motion. As well as how Label Maker, a tool integrated within the Autodesk ecosystem, uses AI to turn raw motion data and videos into richly tagged, reusable data sets. You will walk away with a clearer picture of how to make motion data actually usable for AI, and how to rethink their pipelines to get there. The real value of motion data isn’t in the capture—it’s in the enrichment.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105099685001PTek"},{"code":"BLD1826-D","title":"From Change to Clarity: Better Multidiscipline Coordination Model in Revit and Autodesk Forma Data Management","type":"Technical Deep Dive","track":"Structural Engineering & Fabrication","industry":"Buildings","products":"Forma Design Collaboration; BIM Collaborate; BIM Collaborate Pro; Forma Data Management Essentials; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Leslaw Janus; Mihaela Stan","abstract":"Discover how to effectively use Revit software’s Coordination Model Changes to monitor and manage updates across disciplines. In this hands-on session, architects and engineers will learn practical methods to detect, review, and act on element changes directly within their models. The session will cover step-by-step workflows for identifying additions, deletions, and modifications, using visual cues, filters, and structured object data. You’ll also explore how to assess geometry, properties, and transformations of updated elements to support better decision making. By the end, you’ll be able to reduce manual coordination effort, improve accuracy, and confidently integrate change tracking into your daily Revit workflows.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105101344001PLQx"},{"code":"CES1044-D","title":"​From Chaos to Control: ACC Model Coordination and API Strategies for Infrastructure Projects","type":"Strategy Talk","track":"Civil Engineering","industry":"Civil infrastructure","products":"Docs; Model Coordination; Navisworks Manage","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Growing Team Leader","speakers":"Maria Albízuri; Adrian Fernandez Sanchez","abstract":"In large-scale infrastructure, \"coordination chaos\" is a common reality. When teams use different tools and inconsistent methods, design mistakes are often caught too late. This leads to expensive rework, missed deadlines, and increased project risk. As projects grow across disciplines, keeping everyone aligned becomes a massive challenge. In this session, we’ll share how Ramboll tamed this complexity by building a standardized, scalable framework using Autodesk Forma industry cloud (formerly Autodesk Construction Cloud). Using the 2025 IFC Viewer, Autodesk Platform Services, and Insight dashboards, Ramboll moved from disconnected software to a single, unified system. We’ve aligned our digital process with ISO 19650 to ensure data moves smoothly from one project phase to the next.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105084873001PMnL"},{"code":"FAB3759-D","title":"From Fragmented Workflows to a Digital Thread: Scaling Modular Construction with PLM at Faith","type":"Strategy Talk","track":"Industrialized Construction","industry":"Building products and fabrication","products":"Fusion Manage; Vault Professional","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Growing Team Leader","speakers":"Darren Hartenstine; Caleb Goins","abstract":"\u003cp>Faith Technologies Incorporated (FTI) is rapidly scaling its modular construction and manufacturing operations. But disconnected systems, manual workflows, and poor data governance created barriers to growth. In partnership with Symetri, Faith is implementing a PLM-driven digital thread connecting Vault software, Autodesk Fusion Manage, Inventor software, and architecture, engineering, and construction (AEC) systems. This transformation enables centralized data, automated design-to-fabrication workflows, and enterprise collaboration. This session will explore how Faith is moving from siloed processes to a connected, scalable ecosystem to accelerate productization and support rapid growth.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105137932001PMSl"},{"code":"BLD2772-D","title":"From good intentions to sustainable decisions","type":"Strategy Talk","track":"Impact & Sustainability","industry":"Buildings","products":"Info360 Asset; Insight; Revit","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Educator & Workforce Builder; Executive & Decision Maker; Growing Team Leader","speakers":"Amarpreet Singh; Michelle aguilar; Becky Burns","abstract":"Most sustainability strategies never make it into daily work. Teams struggle to turn ambition into decisions, data flows, and repeatable processes. This session will explore three sustainability workflows that are actually working today: design-phase carbon estimation, AI-enabled inspection, and material selection informed by connected product and carbon data. We’ll examine how these workflows are structured, where they break, and what it takes to implement them across tools, teams, and data sources—drawing on examples from technology partners such as One Click LCA and VAPAR. You’ll leave with a practical framework for turning sustainability goals into operational workflows.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105122452001P4Ex"},{"code":"CES3092-D","title":"From Innovyze to Tandem: Digital Twins & AI for Climate‑Resilient Water Infrastructure","type":"Strategy Talk","track":"Civil Engineering","industry":"Civil infrastructure","products":"Civil 3D; InfoWater Pro; InfoWorks ICM; Tandem Connect","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Executive & Decision Maker; Growing Team Leader","speakers":"Priyanka Talkal","abstract":"Water infrastructure is entering a decisive decade. In 2026, utilities face climate volatility, aging assets, regulatory pressure, and rising expectations for resilient, transparent service. Traditional approaches based on static hydraulic models and reactive operations are no longer sufficient. This keynote will explore how connected digital twins and AI are reshaping water infrastructure across the full lifecycle—from planning and design to operations and maintenance. It will present a practical workflow showing how Innovyze modeling outputs evolve into a live operational digital twin in Autodesk Tandem software, enabling continuity from design to asset maintenance, and supporting predictive, risk‑based decision making.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105127983001PeKd"},{"code":"MFG2259-D","title":"From Inventor Design to Machined Part: Building a Real Digital Thread with Autodesk Fusion CAM","type":"Technical Deep Dive","track":"Manufacturing Engineering","industry":"Manufacturing Other","products":"Fusion; Fusion Manufacturing Extension; Fusion Nesting and Fabrication Extension; Inventor; Vault Professional","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Small Business","speakers":"Edward Rose","abstract":"In this technical deep dive, we’ll walk through a real machined project designed in Inventor and programmed in Autodesk Fusion Manufacturing Extension. Follow the complete workflow: creating and iterating the part in Inventor, uploading to Fusion, applying toolpaths, generating G-code, and efficiently updating toolpaths after design changes using simple refreshes. We’ll cover both the cloud approach (AnyCAD linked references and Desktop Connector) and the enterprise version using Vault Professional software for controlled releases and revision management. We’ll share the actual files, challenges encountered, key lessons, and measurable time savings. You’ll leave with actionable steps to build an effective digital thread between design and manufacturing teams.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105113097001P8dj"},{"code":"AS1983-D","title":"From Massing to Metrics: Integrating Autodesk Forma and Autodesk Forma Carbon Insights for Outcome-Based Design","type":"Technical Deep Dive","track":"MEP Engineering & Fabrication","industry":"Architecture services","products":"Forma; Insight; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Isaac McCormack; Jessica Carson; Michael Sturm","abstract":"Around 80% of a building’s environmental impact is determined in the first 20% of design, yet this phase often relies on intuition rather than data. This presentation will introduce GHD’s outcome-based workflow that embeds predictive AI and cloud simulation into early design, providing carbon insights when decisions matter. Autodesk Forma (formerly Autodesk Construction Cloud) enables real-time evaluation of wind, thermal comfort, and early embodied carbon from simple massing models. As designs progress, Autodesk Forma Carbon Insights (formerly Autodesk Insight) calculates energy-use intensity and examines trade-offs between operational and embodied carbon. The result is an iterative, data-driven approach that integrates carbon performance into design and enables credible sustainability narratives from project inception.","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105104668001PXiN"},{"code":"CES1305-D","title":"From Messy to Meaningful: Ground Truth, Update-Ready Site Context in Revit","type":"Technical Deep Dive","track":"Architecture","industry":"Civil infrastructure","products":"Civil 3D; Forma; InfraWorks; Revit","duration":"1 hr","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"07:00 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"Designer, Engineer & Specialist","speakers":"Joseph Huang; Raghavendra Bhat","abstract":"\u003cp>Accurate site context is essential for coordination, yet many teams struggle with fragile or inconsistent site models in Revit. This session presents reliable workflows for building and maintaining site context using common upstream sources, including Forma Site Design generated Revit files, Civil 3D published surfaces, and native Revit tools such as TopoSolids and Building Pads. The focus is on stability and change management – showing how to keep site models update ready as upstream data evolves, while supporting design development, visualization, and downstream coordination with minimal rework or model failure. We'll walk through four practical workflows for bringing site context into Revit and discuss where each one shines and where each one breaks.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105090575001PhDo"},{"code":"CES2548-D","title":"From Pilot to Competitive Advantage: Scaling Generative Design with Autodesk Forma and Infraspace","type":"Strategy Talk","track":"Civil Engineering","industry":"Civil infrastructure","products":"Civil 3D; Forma; Navisworks Manage","duration":"30 min","day":"Tuesday (15th)","date":"2026-09-15","start":"06:00 AM","end":"06:30 AM","mode":"On-demand","featured":"","tabs":"On-demand","learningPath":"","speakers":"Kristoffer Spendrup Bugge; Andreas Bjune Kjølseth","abstract":"\u003cp>Infrastructure projects face increasing demands for faster delivery, lower costs, and more sustainable outcomes. Meeting these demands requires teams to work smarter, deliver higher-quality designs, and make better decisions within tight project deadlines.\u003c/p> \u003cp>Following last year's session, Infraspace and Norconsult will share how they have moved from promising pilots to production use of generative design in real transportation and energy projects.\u003c/p> \u003cp>Powered by Infraspace and integrated with Autodesk Forma, they will demonstrate how engineering teams can streamline planning and early design, and reduce iteration time from weeks to minutes through automated generation of design alternatives for roads and other infrastructure assets.\u003cbr/> \u003cbr/> Through real-world project examples, you will learn how generative design augments engineering expertise, improves project outcomes, and provides a competitive advantage through faster, better-informed design decisions.\u003c/p>","url":"https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital/session/1783105115864001PITz"},{"code":"IM2770-D","title":"From Plant Design to Product Passport: Extending P","type":"Technical Deep Dive","track":"Impact & Sustainability
