# ── AU2026 自動錄影設定 ────────────────────────────────────────────────
# ⚠ 免責聲明：本工具錄影僅供個人學習與課後複習之用。AU 課程內容著作權屬
#   Autodesk 及各講者所有，不得公開散布、轉載、販售或用於商業用途。
#   使用者須自行遵守 AU 使用條款與所在地法令，違法或侵權使用與開發者無關。
# 複製成 config.toml 後修改。所有時間單位為秒，除另有標註。

[schedule]
# 課表 CSV / ICS 檔路徑（相對於本設定檔）
file = "my_schedule.csv"
# code → 課程網址 對照表，由 `au2026rec catalog` 產生
catalog = "catalog.json"
# CSV 內的時間屬於哪個時區。AU 官方匯出一律是太平洋時間。
source_timezone = "America/Los_Angeles"
# 顯示與檔名用的時區
local_timezone = "Asia/Taipei"
# 課表沒有結束時間也沒有 duration 欄位時，預設每場多長（分鐘）
default_duration_minutes = 60
# 活動年份，僅在日期欄缺年份時使用
event_year = 2026
# 哪些 mode/format 值視為「直播」→ 時間鎖死不可挪動
live_modes = ["live", "live-streamed", "live streamed", "livestream", "直播"]
# 重疊處理：
#   shift = 非直播場次往後排隊，直播場次維持原時間（推薦）
#   skip  = 重疊的後一場直接跳過
#   keep  = 照原時間硬幹（會互相打斷，不建議）
overlap_policy = "shift"
# 只錄這些 Status 的列（AU 匯出的第一欄）。留空字串一併保留無狀態欄的課表。
status_include = ["scheduled", "registered", "confirmed", "已排定", ""]

[recording]
# 提前幾秒開網頁、按播放（給頁面載入與廣告緩衝）
lead_seconds = 90
# 結束後多錄幾秒（講者常超時）
tail_seconds = 120
# 一場錄完後休息幾秒再進下一場
gap_seconds = 15
# 輸出檔名樣板。可用：{code} {title} {start_local} {end_local} {mode} {track} {index}
filename_template = "{start_local:%Y%m%d_%H%M}_{code}_{title}"
# 檔名最長字元數（Windows 路徑限制）
filename_max_length = 120
# 錄影期間每隔幾秒確認影片真的還在播（0 = 不監看）。
# 卡住時的三段式救援：記一筆 → 解鎖畫質回 auto → 重載頁面。
# 這是鎖死 preferred_height 的配套：鎖住畫質等於關掉 ABR 自動降階，
# 網路一抖就不是畫質變差而是轉圈圈，所以要有人盯著幫它解開。
watch_every = 30
# 最多重載幾次，超過就只記錯誤交給人處理（錄影不會停）
watch_max_reloads = 3

[obs]
host = "localhost"
port = 4455
password = ""          # OBS →「工具」→「WebSocket 伺服器設定」裡的密碼
# 錄影前切到這個場景，留空 = 不切換
scene = ""
# 連不上 OBS 時是否仍照排程開網頁（true = 只開課不錄影）
continue_without_obs = false

[browser]
# 導頁方式：
#   attach = 接管一個用一般方式開、已經登入的瀏覽器（預設）。
#            登入不會被自動化偵測擋下。用選單的「開瀏覽器登入 AU2026」
#            或指令 `au2026rec browser --set-mode` 一鍵開好。
#            代價：那個瀏覽器視窗要一直開著，程式靠它導頁。
#   open   = 只呼叫系統「開這個網址」，零自動化（每場開新分頁）。
mode = "attach"
# attach 要接的除錯埠
cdp_url = "http://localhost:9222"
# 接不上瀏覽器時，是否退回 open 模式（至少網頁會開、畫面錄得到）
fallback_to_open = true
# 開瀏覽器登入時先開這一頁
login_url = "https://conferences.autodesk.com/flow/autodesk/au2026/sessioncatalog/page/digital"
# 登入用瀏覽器的 profile 目錄，登入狀態存在這裡
attach_profile_dir = "attach-profile"
# 自動播放旗標。兩面刃，2026-09-16 用真實課程頁實測：
#   false（預設）= 直播進頁面就正常播；但 On-demand 點了播放鍵不會動
#   true         = On-demand 點了會播；但直播會壞掉（畫面一直轉圈圈）
# 錄直播時保持 false，之後補錄 On-demand 再開成 true（或用 browser --autoplay）。
allow_autoplay = false

# 開登入用瀏覽器時要多帶的旗標，原樣接在命令列後面。程式不解讀內容。
# 預設空的；留給「只能靠瀏覽器旗標解」的環境問題。實例（2026-09-16 實測）：
# 台灣家用光纖連 Brightcove 直播的 CDN 節點時，IPv4 那條路壅塞、畫質一路被壓到
# 最低還轉圈圈，改走 IPv6 就穩定 1080p。把該網域釘到 IPv6 位址：
#   extra_args = ["--host-resolver-rules=MAP fastly.live.brightcove.com [2a04:4e42:87::539]"]
# 位址要自己查（nslookup -type=AAAA fastly.live.brightcove.com），而且會變 ——
# 這是排錯手段，不是預設值。改完要重開瀏覽器才生效。
extra_args = []

# 程式不碰視窗的大小與位置：你把瀏覽器擺成什麼樣，OBS 錄到的就是什麼樣。

# 開頁後等網頁靜止幾秒再找播放鍵
settle_seconds = 8
# 播放鍵候選選擇器，由上往下試，點到第一個可見的就停。
# 全部沒命中也不影響錄影，只是不會自動播；用 `au2026rec probe <code>` 可以
# 印出實際頁面上的候選按鈕來補這份清單。
play_selectors = [
  # 2026-09-15 在真實 AU 課程頁 probe 出來的：平台用 video.js（Brightcove），
  # 播放鍵是 <button class="vjs-big-play-button">Play Video</button>。
  # 只列「明確是按鈕」的選擇器 —— 不要放 "video" 或播放器容器，
  # 那些點下去會 toggle 暫停，直播進頁面就自動播，點它等於把直播按停。
  ".vjs-big-play-button",
  "button:has-text('Play Video')",
  # 備援，萬一平台改版
  "button:has-text('Watch now')",
  "button:has-text('Join session')",
  "button:has-text('Play')",
  "a:has-text('Watch now')",
]
# 嘗試關掉的彈窗（cookie 同意、歡迎視窗等）
dismiss_selectors = [
  "button:has-text('Accept all')",
  "button:has-text('Accept')",
  "button:has-text('Got it')",
  "button[aria-label='Close']",
]
# 開始播放後把播放器捲到畫面正中央 —— 課程頁的播放器預設偏上，
# 整個螢幕錄下來會上下留一堆空白
# 播放器預設是靜音的，進去要幫忙打開，不然整場錄下來沒聲音
unmute = true
# 把播放器畫質鎖到這個高度，避免自動畫質掉到 360p/720p。0 = 不鎖（維持 auto）
preferred_height = 1080
center_player = true
# 每場錄完是否把分頁導回空白頁（停掉影片與聲音）
close_page_after = true

[paths]
# 執行紀錄輸出位置
log_file = "logs/au2026rec.log"
report_file = "logs/sessions.csv"

[library]
# 每堂課一個資料夾，裡面放影片(或錄影) + 字幕 + 附件 + session.json。
# 直播錄完的檔案會搬進來，On-demand 下載的影片也放這裡。
enabled = true
# 課程資料夾放在哪。
# 留空 = 你的「影片」資料夾底下的 AU2026（例如 C:\Users\你\Videos\AU2026）——
# 幾十 GB 的課程影片不該躺在程式資料夾裡。要指定就填完整路徑，例如
#   root = 'D:\AU2026'
# （用單引號，Windows 路徑的反斜線才不會被當成跳脫字元）
root = ""
# 要不要順便抓課程附件（講義、簡報 PDF）
attachments = true
# 要不要抓官方字幕（只有 download 模式拿得到；直播沒有）
subtitles = true
# download 指令要抓的畫質高度。720 約 1 GB/小時，1080 約 1.5 GB/小時。
download_height = 720
# ffmpeg 執行檔。不在 PATH 裡就填完整路徑。
ffmpeg = "ffmpeg"
# 等影片串流網址出現的秒數
manifest_wait_seconds = 45
